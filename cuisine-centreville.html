<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mwaka KDS PRO - CENTRE VILLE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="screen-orientation" content="landscape">
    <link rel="icon" type="image/png" href="https://moniresto.com/mwakapizza/img/favicon.ico">
    <link rel="apple-touch-icon" href="https://moniresto.com/mwakapizza/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #e74c3c; --blue: #3498db; --green: #2ecc71; --orange: #f39c12; --dark: #000; --card: #111; --danger: #4a0404; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: #fff; margin:0; padding: 0; overflow: hidden; -webkit-user-select: none; user-select: none; }
        
        /* === FULLSCREEN OVERLAY === */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #000 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 2vh; cursor: pointer; padding: 2vh 5vw;
        }
        #fullscreen-overlay .logo-icon { font-size: clamp(40px, 8vh, 80px); color: var(--orange); animation: pulse-logo 2s infinite; }
        #fullscreen-overlay h1 { font-size: clamp(22px, 5vh, 42px); font-weight: 900; letter-spacing: 3px; color: #fff; margin: 0; text-align: center; }
        #fullscreen-overlay h2 { font-size: clamp(14px, 2.5vh, 20px); color: var(--blue); font-weight: 400; margin: 0; }
        #fullscreen-overlay .tap-hint { 
            margin-top: 1vh; padding: clamp(10px, 2vh, 20px) clamp(30px, 6vw, 60px); 
            border: 3px solid var(--green); border-radius: 20px;
            font-size: clamp(16px, 3vh, 24px); font-weight: 900; color: var(--green); text-transform: uppercase;
            animation: pulse-tap 1.5s infinite;
        }
        @keyframes pulse-logo { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        @keyframes pulse-tap { 0%,100% { opacity: 1; box-shadow: 0 0 10px rgba(46,204,113,0.3); } 50% { opacity: 0.6; box-shadow: 0 0 30px rgba(46,204,113,0.6); } }

        /* === HEADER — compact responsive === */
        .header-top { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 6px 15px; border-bottom: 2px solid #333; height: clamp(44px, 7vh, 56px); gap: 15px; }
        .shop-title { font-weight: 900; font-size: clamp(14px, 2vw, 20px); letter-spacing: 1px; white-space: nowrap; }
        .search-box { flex-grow: 1; position: relative; max-width: 400px; }
        .search-box input { width: 100%; background: #1a1a1a; border: 2px solid var(--blue); padding: 8px 40px 8px 15px; border-radius: 8px; color: #fff; font-size: clamp(13px, 1.5vw, 16px); outline: none; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--blue); }
        .flux-info { background: #1a1a1a; padding: 6px 14px; border-radius: 30px; border: 1px solid var(--orange); color: var(--orange); font-weight: 900; font-size: clamp(12px, 1.5vw, 16px); white-space: nowrap; }

        .header-controls { display: flex; align-items: center; gap: 12px; }
        .fullscreen-btn { display: none; }
        #wake-status { font-size: 10px; color: var(--green); opacity: 0.7; }
        
        .bt-btn { background: #1a1a1a; border: 1px solid #333; color: #888; padding: 10px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; min-height: 44px; }
        .bt-btn.connected { color: var(--green); border-color: var(--green); background: rgba(46, 204, 113, 0.1); }

        /* === TABS — grosses zones tactiles tablette === */
        .tabs { display: flex; background: #000; position: sticky; top: 0; z-index: 2000; height: clamp(60px, 10vh, 80px); gap: 8px; padding: 8px 10px; }
        .tab-btn { flex: 1; border: 1px solid #333; border-radius: 12px; font-size: clamp(10px, 1.4vw, 14px); font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.4; color: #fff; text-transform: uppercase; cursor: pointer; transition: 0.3s; min-height: 44px; }
        .tab-btn.active { opacity: 1; border: 2px solid #fff; transform: translateY(-2px); }
        #tab-afaire { background: #641e16; } #tab-encours { background: #1b4f72; } #tab-aufour { background: #7e5109; } #tab-termine { background: #145a32; }
        .badge { background: #fff; color: #000; padding: 2px 12px; border-radius: 10px; font-size: 16px; margin-top: 4px; font-weight: 900; }

        /* === GRILLE CARTES — 3 colonnes optimisé paysage === */
        .kds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1vw, 12px); padding: clamp(8px, 1vw, 12px); height: calc(100vh - clamp(120px, 18vh, 148px)); overflow-y: auto; align-content: start; -webkit-overflow-scrolling: touch; }
        .order-card { background: var(--card); border-radius: 12px; border: 1px solid #fff; border-left: 10px solid var(--blue); min-height: clamp(300px, 55vh, 460px); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .order-card.is-web { border-color: var(--blue); border-width: 2px; }
        .order-card.danger-mode { background: var(--danger) !important; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 5px var(--red); } 50% { box-shadow: 0 0 20px var(--red); } }

        .card-header { padding: 12px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: flex-start; }
        .client-name { font-size: 14px; color: #aaa; text-transform: uppercase; margin: 0; font-weight: bold; }
        .phone-text { color: var(--orange); font-weight: 900; font-size: 15px; }
        .status-indicators { display: flex; gap: 10px; align-items: center; }
        .timer-badge { background: #fff; color: #000; padding: 4px 10px; border-radius: 8px; font-weight: 900; font-size: clamp(14px, 2vw, 18px); font-family: monospace; border: 2px solid var(--orange); }
        .slot-badge { background: var(--orange); color: #000; padding: 4px 10px; border-radius: 8px; font-weight: 900; font-size: clamp(13px, 1.8vw, 16px); border: 2px solid #fff; }

        .drive-picto { font-size: 28px; color: #333; }
        .drive-enroute { color: var(--blue); animation: car-move 2s infinite; }
        .drive-arrived { color: var(--green); animation: blink 1s infinite; font-size: 34px; }

        .source-tag { padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 11px; margin-bottom: 5px; display: inline-block; text-transform: uppercase; }
        .source-web { background: var(--blue); color: #fff; }
        .source-tel { background: var(--green); color: #000; }
        .type-tag { padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 11px; margin-bottom: 5px; display: inline-block; text-transform: uppercase; border: 1px solid #fff; }
        .type-livraison { background: var(--red); color: #fff; }

        .card-body { padding: clamp(8px, 1.5vw, 12px); flex-grow: 1; }
        .delivery-box { background: rgba(231, 76, 60, 0.15); padding: 10px; border-radius: 8px; border-left: 5px solid var(--red); margin-bottom: 10px; }
        .addr-text { font-weight: 900; color: #fff; text-transform: uppercase; font-size: 13px; display: block; }
        .pay-tag { display: inline-block; background: var(--orange); color: #000; padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 11px; margin-top: 5px; }

        .item-line { border-bottom: 1px solid #222; padding: 10px 0; }
        .pizza-title { font-size: clamp(1.2em, 2vw, 1.6em); font-weight: 900; display: block; line-height: 1.1; }
        .matching-pizza { color: var(--orange); animation: match-blink 1.5s infinite; }
        @keyframes match-blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .dress-icon { color: var(--green); font-size: 0.9em; margin-left: 5px; }
        .note-tag { background: var(--red); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: 900; display: inline-block; margin-top: 6px; }
        .supp-tag { color: var(--orange); font-size: 14px; font-weight: bold; display: block; padding-left: 15px; }
        .extras-area { margin-top: 12px; padding: 10px; border: 1px dashed #555; border-radius: 8px; background: #000; font-size: 14px; }

        /* === FOOTER BOUTONS — gros tactiles === */
        .card-footer { padding: clamp(6px, 1vw, 10px); background: rgba(0,0,0,0.4); border-top: 1px solid #333; display: flex; gap: 8px; margin-top: auto; }
        .btn { height: clamp(48px, 7vh, 60px); border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.96); }
        .btn-print { background: #222; color: #fff; border: 1px solid #fff; width: clamp(55px, 7vw, 70px); font-size: clamp(18px, 2.5vw, 22px); transition: 0.3s; }
        .btn-print.printed { background: var(--green) !important; color: #000 !important; }
        .btn-action { background: var(--blue); color: #fff; flex-grow: 1; font-size: clamp(14px, 1.8vw, 17px); }
        .btn-green { background: var(--green); color: #000; }

        .list-section { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
        .detailed-row { display: flex; align-items: center; background: #111; border-radius: 12px; padding: 12px 18px; border: 1px solid #fff; border-left: 10px solid var(--blue); gap: 20px; min-height: 70px; }
        .row-info { width: 240px; flex-shrink: 0; }
        .row-items { flex-grow: 1; font-size: 1.15em; font-weight: bold; }
        .row-actions { display: flex; gap: 10px; align-items: center; }

        #oven-alert { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; padding: 15px 40px; border-radius: 50px; font-weight: 900; z-index: 9999; display: none; border: 2px solid #fff; animation: blink 0.5s infinite; }

        /* Print debug toast */
        .print-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            border: 1px solid var(--blue);
            border-radius: 12px;
            padding: 15px 20px;
            max-width: 400px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 99999;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            display: none;
        }
        .print-toast.visible { display: block; }
        .print-toast .log-ok { color: var(--green); }
        .print-toast .log-err { color: var(--red); }
        .print-toast .log-info { color: var(--blue); }

        /* === SCROLLBAR INVISIBLE === */
        .kds-grid::-webkit-scrollbar { width: 4px; }
        .kds-grid::-webkit-scrollbar-track { background: transparent; }
        .kds-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* === FULLSCREEN RESTORE BANNER === */
        #fs-restore {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 90000;
            background: rgba(0,0,0,0.92); color: var(--green);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            font-size: clamp(18px, 3vh, 28px); font-weight: 900; text-transform: uppercase;
            cursor: pointer; gap: 15px; letter-spacing: 1px;
            animation: pulse-tap 1.5s infinite;
        }

        /* === PORTRAIT WARNING === */
        #portrait-warning {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        #portrait-warning i { font-size: 60px; color: var(--orange); animation: rotate-hint 2s infinite; }
        #portrait-warning p { font-size: 22px; font-weight: 900; color: #fff; }
        @keyframes rotate-hint { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
        @media (orientation: portrait) {
            #portrait-warning { display: flex !important; }
        }

        /* === RESPONSIVE — Landscape compact (height < 500px, ex: phones landscape) === */
        @media (orientation: landscape) and (max-height: 500px) {
            #fullscreen-overlay { gap: 1vh; padding: 1vh 3vw; }
            #fullscreen-overlay .logo-icon { font-size: 30px; }
            #fullscreen-overlay h1 { font-size: 20px; }
            #fullscreen-overlay h2 { font-size: 12px; }
            #fullscreen-overlay .tap-hint { padding: 8px 25px; font-size: 14px; margin-top: 0; }
            .header-top { height: 44px; padding: 4px 10px; }
            .shop-title { font-size: 14px; }
            .tabs { height: 55px; gap: 5px; padding: 5px 8px; }
            .tab-btn { font-size: 10px; min-height: 40px; }
            .badge { font-size: 12px; padding: 1px 8px; }
            .kds-grid { height: calc(100vh - 110px); gap: 8px; padding: 8px; }
            .order-card { min-height: 320px; }
            .card-header { padding: 8px; }
            .card-body { padding: 8px; }
            .card-footer { padding: 6px; }
            .btn { height: 44px; }
            .pizza-title { font-size: 1.2em; }
            .timer-badge { font-size: 14px; padding: 2px 8px; }
        }

        /* === RESPONSIVE — Galaxy Tab 10" landscape (typical 1200x800 or 1920x1200) === */
        @media (orientation: landscape) and (min-height: 500px) and (max-height: 850px) {
            .header-top { height: 52px; }
            .tabs { height: 72px; }
            .tab-btn { font-size: 12px; }
            .kds-grid { height: calc(100vh - 136px); }
            .order-card { min-height: 400px; }
            .pizza-title { font-size: 1.5em; }
        }

        /* === RESPONSIVE — Large tablets / desktop landscape (height > 850px) === */
        @media (orientation: landscape) and (min-height: 850px) {
            .header-top { height: 60px; }
            .shop-title { font-size: 22px; }
            .tabs { height: 85px; }
            .tab-btn { font-size: 14px; }
            .badge { font-size: 18px; }
            .kds-grid { height: calc(100vh - 157px); gap: 15px; padding: 15px; }
            .order-card { min-height: 520px; }
            .pizza-title { font-size: 1.8em; }
            .btn { height: 65px; }
            .btn-action { font-size: 18px; }
        }

        /* === RESPONSIVE — Width based: 2 columns for narrower screens === */
        @media (max-width: 900px) {
            .kds-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* === RESPONSIVE — Width based: 1 column for very narrow === */
        @media (max-width: 600px) {
            .kds-grid { grid-template-columns: 1fr; }
            .header-top { flex-wrap: wrap; height: auto; padding: 8px; gap: 8px; }
            .search-box { max-width: 100%; order: 3; }
            .header-controls { order: 2; }
            .detailed-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .row-info { width: 100%; }
            .row-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <!-- === PORTRAIT WARNING === -->
    <div id="portrait-warning">
        <i class="fas fa-mobile-alt"></i>
        <p>TOURNEZ LA TABLETTE EN PAYSAGE</p>
    </div>

    <!-- === FULLSCREEN OVERLAY — tap to start === -->
    <div id="fullscreen-overlay" onclick="launchFullscreen()">
        <div class="logo-icon">🍕</div>
        <h1>MWAKA CENTRE VILLE</h1>
        <h2>KDS PRO — Cuisine</h2>
        <div class="tap-hint"><i class="fas fa-hand-pointer"></i>&nbsp; TOUCHEZ POUR DEMARRER</div>
    </div>

    <!-- === RESTORE FULLSCREEN BANNER === -->
    <div id="fs-restore" onclick="restoreFullscreen()" style="display:none;">
        <i class="fas fa-expand"></i>&nbsp; TOUCHEZ POUR REVENIR EN PLEIN ECRAN
    </div>

    <div id="oven-alert">⚠️ FOUR SATURE : CAPACITE MAXIMALE !</div>

    <div class="header-top">
        <div class="shop-title">MWAKA CENTRE VILLE</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Recherche Nom, Tel, Pizza, Adresse..." onkeyup="searchOrders()">
            <i class="fas fa-search"></i>
        </div>
        <div class="header-controls">
            <button id="bt-connect" class="bt-btn" onclick="connectPrinter()">
                <i class="fas fa-print"></i> IMPRIMER
            </button>
            <div id="wake-status"><i class="fas fa-sun"></i> ACTIVE</div>
            <div class="flux-info" id="flux-tracker">Flux : -- min</div>
            <button class="fullscreen-btn" onclick="toggleFullScreen()"><i class="fas fa-expand"></i></button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab-btn active" id="tab-afaire" onclick="switchTab('en_attente')">A FAIRE <span id="c-afaire" class="badge">0</span></div>
        <div class="tab-btn" id="tab-encours" onclick="switchTab('production')">EN COURS <span id="c-encours" class="badge">0</span></div>
        <div class="tab-btn" id="tab-aufour" onclick="switchTab('cuisson')">AU FOUR <span id="c-aufour" class="badge">0</span></div>
        <div class="tab-btn" id="tab-termine" onclick="switchTab('termine')">FINI <span id="c-termine" class="badge">0</span></div>
    </div>

    <div id="ordersContainer" class="kds-grid"></div>

    <!-- Debug toast for print -->
    <div id="printToast" class="print-toast"></div>

    <audio id="alertSound" loop src="https://assets.mixkit.co/active_storage/sfx/2855/2855-preview.mp3"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        // ====================================================
        // STATE — use var for hoisting safety
        // ====================================================
        var db = null;
        var sound = null;
        var MY_SHOP = "centre-ville";
        var DRESSING_LIST = ['DANJE', 'SIRENE', 'OU LA', 'TOMBOLO'];
        var currentTab = 'en_attente';
        var allOrders = [];
        var searchQuery = "";

        // ====================================================
        // PRINT ENGINE V5 — TRIPLE MODE
        // Mode 1: RawBT Intent (Android tablette + BT Classic) — PRINCIPAL
        // Mode 2: Web Serial (PC/Mac + BT Classic SPP)
        // Mode 3: Web Bluetooth BLE — FALLBACK
        // ====================================================
        var serialPort = null;
        var serialWriter = null;
        var printMode = null; // 'rawbt', 'serial', or 'ble'
        
        // BLE fallback vars
        var printCharacteristic = null;
        var printDevice = null;
        var allWritableChars = [];

        // Detect Android
        var isAndroid = /android/i.test(navigator.userAgent);

        // Debug logger
        function printLog(msg, type) {
            type = type || 'info';
            // En mode RawBT on n'affiche pas le toast debug
            if (printMode === 'rawbt' || isAndroid) return;
            var toast = document.getElementById('printToast');
            if (!toast) return;
            var cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : 'log-info';
            toast.innerHTML += '<div class="' + cls + '">[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>';
            toast.scrollTop = toast.scrollHeight;
            toast.classList.add('visible');
            clearTimeout(toast._hideTimer);
            toast._hideTimer = setTimeout(function() { toast.classList.remove('visible'); }, 15000);
        }

        /**
         * Main connect button — auto-detect best mode
         */
        async function connectPrinter() {
            if (isAndroid) {
                // On Android: use RawBT (no connect step needed)
                printMode = 'rawbt';
                document.getElementById('bt-connect').classList.add('connected');
                document.getElementById('bt-connect').innerHTML = '<i class="fas fa-print"></i> RAWBT OK';
                printLog('Mode RawBT (Android). Assurez-vous que RawBT est installe et connecte a la JoliMark.', 'ok');
                // Send a quick test via plain text mode
                sendViaRawBT("TEST JOLIMARK\n\n\n");
                return;
            }

            // On Desktop: try Web Serial first
            if ('serial' in navigator) {
                try {
                    await connectSerial();
                    return;
                } catch(e) {
                    if (e.message.indexOf('cancelled') === -1 && e.message.indexOf('No port') === -1) {
                        printLog('Serial echoue: ' + e.message, 'err');
                    }
                }
            }

            // Last fallback: BLE
            if ('bluetooth' in navigator) {
                try {
                    await connectBLE();
                } catch(e) {
                    if (e.message.indexOf('cancelled') === -1) {
                        printLog('BLE echoue: ' + e.message, 'err');
                    }
                }
            } else {
                printLog('Aucune methode d\'impression disponible!', 'err');
                alert("Installez RawBT depuis le Play Store pour imprimer via Bluetooth.");
            }
        }

        // ====================================================
        // MODE 1: RAWBT INTENT (Android — Bluetooth Classic)
        // Uses hidden iframe to trigger rawbt: intent WITHOUT leaving the browser
        // ====================================================
        function triggerRawBTIntent(uri) {
            var iframe = document.createElement('iframe');
            iframe.style.cssText = 'display:none;width:0;height:0;border:0;';
            iframe.src = uri;
            document.body.appendChild(iframe);
            setTimeout(function() { 
                try { document.body.removeChild(iframe); } catch(e) {} 
            }, 3000);
        }

        function sendViaRawBT(textContent) {
            triggerRawBTIntent("rawbt:" + encodeURI(textContent));
            printLog('Envoi texte via RawBT (iframe)...', 'ok');
            return true;
        }

        /**
         * Send raw ESC/POS bytes via RawBT using base64 raw mode
         * Via hidden iframe — stays in fullscreen
         */
        function sendBytesViaRawBT(data) {
            var binary = '';
            for (var i = 0; i < data.length; i++) {
                binary += String.fromCharCode(data[i]);
            }
            var base64 = btoa(binary);
            triggerRawBTIntent("rawbt:base64," + base64);
            printLog('Envoi ESC/POS brut via RawBT (' + data.length + ' octets)', 'ok');
            return true;
        }

        // ====================================================
        // MODE 2: WEB SERIAL (Desktop — Bluetooth Classic SPP)
        // ====================================================
        async function connectSerial() {
            printLog('Ouverture du port serie (Bluetooth SPP)...');
            serialPort = await navigator.serial.requestPort();
            await serialPort.open({ baudRate: 9600 });
            printLog('Port serie ouvert a 9600 baud', 'ok');
            
            serialWriter = serialPort.writable.getWriter();

        // ====================================================
        // ENCODING — ASCII for thermal printers
        // ====================================================
        function stringToBytes(str) {
            var charMap = {
                '\u00e9': 'e', '\u00e8': 'e', '\u00ea': 'e', '\u00eb': 'e',
                '\u00e0': 'a', '\u00e2': 'a', '\u00e4': 'a',
                '\u00f9': 'u', '\u00fb': 'u', '\u00fc': 'u',
                '\u00f4': 'o', '\u00f6': 'o',
                '\u00ee': 'i', '\u00ef': 'i',
                '\u00e7': 'c',
                '\u00c9': 'E', '\u00c8': 'E', '\u00ca': 'E', '\u00cb': 'E',
                '\u00c0': 'A', '\u00c2': 'A', '\u00c4': 'A',
                '\u00d9': 'U', '\u00db': 'U', '\u00dc': 'U',
                '\u00d4': 'O', '\u00d6': 'O',
                '\u00ce': 'I', '\u00cf': 'I',
                '\u00c7': 'C'
            };
            var cleaned = '';
            for (var i = 0; i < str.length; i++) {
                var ch = str[i];
                var code = ch.charCodeAt(0);
                if (charMap[ch] !== undefined) cleaned += charMap[ch];
                else if (code < 128) cleaned += ch;
                else cleaned += ' ';
            }
            var bytes = new Uint8Array(cleaned.length);
            for (var i = 0; i < cleaned.length; i++) {
                bytes[i] = cleaned.charCodeAt(i) & 0xFF;
            }
            return bytes;
        }

        /**
         * Convert string to clean ASCII (for RawBT plain text mode)
         */
        function cleanText(str) {
            var charMap = {
                '\u00e9': 'e', '\u00e8': 'e', '\u00ea': 'e', '\u00eb': 'e',
                '\u00e0': 'a', '\u00e2': 'a', '\u00e4': 'a',
                '\u00f9': 'u', '\u00fb': 'u', '\u00fc': 'u',
                '\u00f4': 'o', '\u00f6': 'o',
                '\u00ee': 'i', '\u00ef': 'i',
                '\u00e7': 'c',
                '\u00c9': 'E', '\u00c8': 'E', '\u00ca': 'E', '\u00cb': 'E',
                '\u00c0': 'A', '\u00c2': 'A', '\u00c4': 'A',
                '\u00d9': 'U', '\u00db': 'U', '\u00dc': 'U',
                '\u00d4': 'O', '\u00d6': 'O',
                '\u00ce': 'I', '\u00cf': 'I',
                '\u00c7': 'C'
            };
            var result = '';
            for (var i = 0; i < str.length; i++) {
                var ch = str[i];
                if (charMap[ch] !== undefined) result += charMap[ch];
                else if (ch.charCodeAt(0) < 128) result += ch;
                else result += ' ';
            }
            return result;
        }

        // ====================================================
        // SEND DATA — routes to RawBT, Serial or BLE
        // ====================================================
        async function sendToPrinter(data) {
            if (printMode === 'rawbt') {
                return sendBytesViaRawBT(data);
            } else if (printMode === 'serial') {
                return await sendViaSerial(data);
            } else if (printMode === 'ble') {
                return await sendViaBLE(data);
            } else {
                // Auto-detect: if Android, use RawBT directly
                if (isAndroid) {
                    printMode = 'rawbt';
                    document.getElementById('bt-connect').classList.add('connected');
                    document.getElementById('bt-connect').innerHTML = '<i class="fas fa-print"></i> RAWBT';
                    return sendBytesViaRawBT(data);
                }
                printLog('Imprimante non connectee', 'err');
                alert("Cliquez sur IMPRIMER pour connecter l'imprimante d'abord.");
                return false;
            }
        }

        async function sendViaSerial(data) {
            if (!serialWriter) return false;
            try {
                await serialWriter.write(data);
                printLog('Serial OK (' + data.length + ' octets)', 'ok');
                return true;
            } catch(e) {
                printLog('Erreur Serial: ' + e.message, 'err');
                try {
                    serialWriter.releaseLock();
                    serialWriter = serialPort.writable.getWriter();
                    await serialWriter.write(data);
                    return true;
                } catch(e2) {
                    printMode = null;
                    document.getElementById('bt-connect').classList.remove('connected');
                    document.getElementById('bt-connect').innerHTML = '<i class="fas fa-print"></i> IMPRIMER';
                    return false;
                }
            }
        }

        async function sendViaBLE(data) {
            if (allWritableChars.length === 0) return false;
            if (printDevice && !printDevice.gatt.connected) {
                try { await printDevice.gatt.connect(); } 
                catch(e) { return false; }
            }
            for (var i = 0; i < allWritableChars.length; i++) {
                var wc = allWritableChars[i];
                try {
                    var CHUNK = 100, DELAY = 50;
                    for (var j = 0; j < data.length; j += CHUNK) {
                        var chunk = data.slice(j, Math.min(j + CHUNK, data.length));
                        if (wc.canWriteNoResp) await wc.char.writeValueWithoutResponse(chunk.buffer);
                        else await wc.char.writeValue(chunk.buffer);
                        if (j + CHUNK < data.length) await new Promise(function(r) { setTimeout(r, DELAY); });
                    }
                    printLog('BLE OK via ' + wc.uuid, 'ok');
                    return true;
                } catch(e) { printLog('BLE echec ' + wc.uuid, 'err'); }
            }
            return false;
        }

        /**
         * Build ESC/POS receipt and send to printer
         */
        async function printDirect(id) {
            const o = allOrders.find(x => x.id === id);
            if (!o) { printLog('Commande introuvable: ' + id, 'err'); return; }

            printLog(`Impression commande: ${o.clientName || 'INCONNU'}`);

            // ESC/POS commands as raw bytes
            const ESC = 0x1B;
            const GS = 0x1D;

            // Build receipt as byte arrays
            const parts = [];

            // Initialize printer
            parts.push(new Uint8Array([ESC, 0x40])); // ESC @ — Initialize

            // === HEADER ===
            const isLivrTicket = (o.type || "").toUpperCase().includes("LIVRAISON");
            parts.push(new Uint8Array([ESC, 0x61, 0x01])); // Center align
            
            if (isLivrTicket) {
                // LIVRAISON en gros
                parts.push(new Uint8Array([GS, 0x21, 0x11]));   // Double width+height
                parts.push(new Uint8Array([ESC, 0x45, 0x01]));  // Bold ON
                parts.push(stringToBytes("LIVRAISON\n"));
                parts.push(new Uint8Array([GS, 0x21, 0x00]));   // Normal size
                parts.push(new Uint8Array([ESC, 0x45, 0x00]));  // Bold OFF
                // Nom en petit
                parts.push(stringToBytes((o.clientName || "INCONNU").toUpperCase() + "\n"));
            } else {
                // NOM en gros (emporter)
                parts.push(new Uint8Array([GS, 0x21, 0x11]));   // Double width+height
                parts.push(new Uint8Array([ESC, 0x45, 0x01]));  // Bold ON
                parts.push(stringToBytes((o.clientName || "INCONNU").toUpperCase() + "\n"));
                parts.push(new Uint8Array([GS, 0x21, 0x00]));   // Normal size
                parts.push(new Uint8Array([ESC, 0x45, 0x00]));  // Bold OFF
            }

            // === CRENEAU ===
            parts.push(new Uint8Array([GS, 0x21, 0x01]));   // Double height
            parts.push(new Uint8Array([ESC, 0x45, 0x01]));  // Bold ON
            parts.push(stringToBytes((o.slotTime || "ASAP") + "\n"));
            parts.push(new Uint8Array([GS, 0x21, 0x00]));   // Normal size
            parts.push(new Uint8Array([ESC, 0x45, 0x00]));  // Bold OFF
            parts.push(stringToBytes("================================\n"));

            // === INFOS === (left align)
            parts.push(new Uint8Array([ESC, 0x61, 0x00])); // Left align
            parts.push(stringToBytes("TEL: " + (o.phone || "") + "\n"));
            
            if (o.address) {
                parts.push(stringToBytes("ADR: " + o.address.toUpperCase() + "\n"));
            }
            
            // Payment method + total — uniquement pour commandes TEL en livraison
            const isTel = !o.source || (o.source !== "WEB" && o.source !== "PRESTASHOP");
            if (isTel && isLivrTicket) {
                parts.push(new Uint8Array([ESC, 0x61, 0x01])); // Center
                parts.push(new Uint8Array([GS, 0x21, 0x11]));   // Double width+height
                parts.push(new Uint8Array([ESC, 0x45, 0x01]));  // Bold ON
                if (o.paymentMethod) {
                    parts.push(stringToBytes("A PAYER: " + o.paymentMethod.toUpperCase() + "\n"));
                }
                if (o.total) {
                    parts.push(stringToBytes("TOTAL: " + o.total + " EUR\n"));
                }
                parts.push(new Uint8Array([GS, 0x21, 0x00]));   // Normal size
                parts.push(new Uint8Array([ESC, 0x45, 0x00]));  // Bold OFF
                parts.push(new Uint8Array([ESC, 0x61, 0x00])); // Left align
            }

            parts.push(stringToBytes("================================\n\n"));

            // === ITEMS ===
            (o.items || []).forEach(p => {
                // Item name in double size
                parts.push(new Uint8Array([GS, 0x21, 0x11]));   // Double size
                parts.push(stringToBytes(p.qty + "x " + (p.name || "").toUpperCase() + "\n"));
                parts.push(new Uint8Array([GS, 0x21, 0x00]));   // Normal size

                // Notes
                if (p.notes) {
                    parts.push(new Uint8Array([ESC, 0x45, 0x01])); // Bold ON
                    parts.push(stringToBytes("  ! " + p.notes.toUpperCase() + "\n"));
                    parts.push(new Uint8Array([ESC, 0x45, 0x00])); // Bold OFF
                }

                // Supplements
                (p.supps || []).forEach(s => {
                    if (typeof s === 'string') {
                        parts.push(stringToBytes("  + " + s.toUpperCase() + "\n"));
                    }
                });

                parts.push(stringToBytes("\n"));
            });

            // === DRINKS & DESSERTS ===
            if ((o.drinks && o.drinks.length > 0) || (o.desserts && o.desserts.length > 0)) {
                parts.push(stringToBytes("--- BOISSONS/DESSERTS ---\n"));
                (o.drinks || []).forEach(d => {
                    parts.push(stringToBytes(d.qty + "x " + (d.name || "").toUpperCase() + "\n"));
                });
                (o.desserts || []).forEach(ds => {
                    parts.push(stringToBytes(ds.qty + "x " + (ds.name || "").toUpperCase() + "\n"));
                });
                parts.push(stringToBytes("\n"));
            }

            // === FOOTER ===
            parts.push(stringToBytes("================================\n"));
            parts.push(new Uint8Array([ESC, 0x61, 0x01])); // Center
            parts.push(stringToBytes("BON SERVICE !\n"));
            parts.push(new Uint8Array([ESC, 0x61, 0x00])); // Left

            // Feed paper and cut
            parts.push(new Uint8Array([ESC, 0x64, 0x06])); // Feed 6 lines
            parts.push(new Uint8Array([GS, 0x56, 0x41, 0x03])); // Partial cut

            // Concatenate all parts into one big Uint8Array
            let totalLen = 0;
            for (const p of parts) totalLen += p.length;
            const fullData = new Uint8Array(totalLen);
            let offset = 0;
            for (const p of parts) {
                fullData.set(p, offset);
                offset += p.length;
            }

            printLog(`Ticket: ${fullData.length} octets`);
            await sendToPrinter(fullData);
        }

                        <div style="color:var(--orange); font-size:14px; font-weight:bold;">${o.phone || ''} | ${getDrivePicto(o)} 
                        ${o.slotTime ? `<span style="color:#fff; background:var(--orange); padding:2px 6px; border-radius:4px; margin-right:5px;">${o.slotTime}</span>` : ''}
                        <span class="timer-badge" style="font-size:14px; padding:2px 8px;">${diff}m</span></div>
                        ${isLivr ? `<div style="margin-top:5px;"><span style="font-size:11px; color:#aaa; display:block;">📍 ${o.address || ""}</span></div>` : ''}</div>
                    <div class="row-items">${(o.items||[]).map(p => `${p.qty}x ${p.name.toUpperCase()}`).join(', ')}</div>
                    <div class="row-actions"><button class="btn btn-print" style="height:50px; width:60px;" onclick="handlePrint(this, '${o.id}')"><i class="fas fa-print"></i></button>${getActionBtn(o, true)}</div></div>`;
        }

        function getActionBtn(o, mini = false) {
            const h = mini ? 'style="height:50px; font-size:14px; padding:0 20px;"' : '';
            if (o.status === 'en_attente') return `<button class="btn btn-action" ${h} onclick="acceptOrder(this, '${o.id}')">ACCEPTER</button>`;
            if (o.status === 'production') return `<button class="btn btn-action" ${h} onclick="upd('${o.id}', 'cuisson', true)">AU FOUR !</button>`;
            if (o.status === 'cuisson') return `<button class="btn btn-action btn-green" ${h} onclick="upd('${o.id}', 'termine')">PRETE !</button>`;
            return `<button class="btn btn-action" ${h} onclick="upd('${o.id}', 'en_attente')">RELANCER</button>`;
        }

        function acceptOrder(btn, id) { 
            const pb = btn.parentElement.querySelector('.btn-print'); 
            handlePrint(pb, id); 
            upd(id, 'production'); 
        }
        
        function handlePrint(btn, id) {
            if (!btn) return;
            printDirect(id);
            const old = btn.innerHTML; 
            btn.innerHTML = '<i class="fas fa-check"></i>'; 
            btn.classList.add('printed');
            setTimeout(() => { btn.innerHTML = '<i class="fas fa-print"></i>'; btn.classList.remove('printed'); }, 3000);
        }

        // Cache recettes PizzApp
        var pizzappRecipes = null;
        var pizzappIngredients = null;

        function loadPizzappRecipes(callback) {
            if (pizzappRecipes) { callback(); return; }
            rtdb.ref('shop_config/pizzapp_recipes').once('value').then(function(snap) {
                var data = snap.val();
                if (data && data.recipes) {
                    pizzappRecipes     = data.recipes;
                    pizzappIngredients = data.ingredients;
                }
                callback();
            }).catch(function() { callback(); });
        }

        function toKg(qty, unit) {
            if (unit === 'kg' || unit === 'L') return qty;
            if (unit === 'g'  || unit === 'ml') return qty / 1000;
            return qty;
        }

        function deduireStocks(orderId, orderItems) {
            if (!rtdb || !orderItems || orderItems.length === 0) return;
            loadPizzappRecipes(function() {
                if (!pizzappRecipes || pizzappRecipes.length === 0) return;
                var today    = new Date().toISOString().slice(0, 10);
                var consumed = [];
                orderItems.forEach(function(item) {
                    var pizzaName = (item.name || '').trim().toLowerCase();
                    var qty = item.qty || 1;
                    var recipe = pizzappRecipes.find(function(r) {
                        return r.name.trim().toLowerCase() === pizzaName;
                    });
                    if (!recipe) {
                        recipe = pizzappRecipes.find(function(r) {
                            return pizzaName.includes(r.name.trim().toLowerCase()) ||
                                   r.name.trim().toLowerCase().includes(pizzaName);
                        });
                    }
                    if (recipe && recipe.items) {
                        recipe.items.forEach(function(ri) {
                            var kgTotal  = toKg(ri.qty, ri.unit) * qty;
                            var existing = consumed.find(function(c) { return c.ingredientId === ri.ingredientId; });
                            if (existing) {
                                existing.consumed_kg += kgTotal;
                            } else {
                                var ing = pizzappIngredients
                                    ? pizzappIngredients.find(function(i) { return i.id === ri.ingredientId; })
                                    : null;
                                consumed.push({ ingredientId: ri.ingredientId, ingredientName: ing ? ing.name : ri.ingredientId, consumed_kg: kgTotal });
                            }
                        });
                    }
                });
                if (consumed.length === 0) return;
                var path = 'stocks/consumptions/' + today + '/' + orderId.replace(/[.#$[\]]/g, '_');
                rtdb.ref(path).set({ orderId: orderId, recordedAt: Date.now(), shop: MY_SHOP, items: consumed })
                    .catch(function(e) { console.warn('Stocks RTDB:', e.message); });
                // Mettre à jour les totaux dans stocks/alerts
                rtdb.ref('stocks/consumptions/' + today).once('value').then(function(snap) {
                    var allData = snap.val() || {};
                    var totals  = {};
                    Object.values(allData).forEach(function(order) {
                        if (!order || !order.items) return;
                        order.items.forEach(function(it) { totals[it.ingredientId] = (totals[it.ingredientId] || 0) + (it.consumed_kg || 0); });
                    });
                    rtdb.ref('stocks/alerts').set({ updatedAt: Date.now(), shop: MY_SHOP, totals: totals });
                }).catch(function() {});
            });
        }

        function upd(id, s, setOven) {
            if (!db) return;
            var d = { status: s };
            if (setOven) d.ovenAt = firebase.firestore.FieldValue.serverTimestamp();
            db.collection("commandes").doc(id).update(d);
            // ── DÉDUCTION STOCKS si terminée ──
            if (s === 'termine') {
                var order = allOrders.find(function(o) { return o.id === id; });
                if (order && order.items && order.items.length > 0) {
                    deduireStocks(id, order.items);
                }
            }
        }

        function render() {
            try {
                const container = document.getElementById('ordersContainer'); container.innerHTML = "";
                let list = searchQuery ? allOrders.filter(o => (o.clientName||"").toLowerCase().includes(searchQuery) || (o.phone||"").includes(searchQuery) || (o.address||"").toLowerCase().includes(searchQuery) || (o.items||[]).some(p => p.name.toLowerCase().includes(searchQuery))) : allOrders.filter(o => (o.status || "").toLowerCase() === currentTab.toLowerCase());
                const mapping = { en_attente: 'tab-afaire', production: 'tab-encours', cuisson: 'tab-aufour', termine: 'tab-termine' };
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                if (!searchQuery && mapping[currentTab]) document.getElementById(mapping[currentTab]).classList.add('active');

                // TRI selon onglet
                if (currentTab === 'cuisson') {
                    list.sort((a,b) => (a.ovenAt?.seconds||a.createdAt?.seconds||0)-(b.ovenAt?.seconds||b.createdAt?.seconds||0));
                } else if (currentTab === 'en_attente') {
                    list.sort((a,b) => (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); // Nouveaux en haut
                } else {
                    list.sort((a,b) => (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
                }

                // Mode recherche, À FAIRE ou TERMINE → liste compacte uniquement
                if (searchQuery || currentTab === 'en_attente' || currentTab === 'termine') {
                    const sec = document.createElement('div'); sec.className = "list-section";
                    list.forEach(o => { if (o) sec.innerHTML += createDetailedRow(o); });
                    container.appendChild(sec);
                } else {
                    // À FAIRE, EN COURS, AU FOUR → top 3 cartes + matching + liste overflow
                    const top3 = list.slice(0, 3); const others = list.slice(3); const counts = {};
                    // Matching: compter les pizzas identiques dans les top 3
                    top3.forEach(o => { if (o && o.items) o.items.forEach(p => { const n = (p.name || "").toUpperCase(); counts[n] = (counts[n] || 0) + 1; }); });
                    [...top3].reverse().forEach(o => { if (o) container.innerHTML += createCard(o, counts); });
                    if (others.length > 0) {
                        const sec = document.createElement('div'); sec.className = "list-section";
                        const label = currentTab === 'en_attente' ? 'EN ATTENTE' : 'SUIVANTS';
                        sec.innerHTML = `<h2 style="font-size:12px; color:#666; margin-left:15px; margin-top:20px;">${label} (${others.length})</h2>`;
                        others.forEach(o => { if (o) sec.innerHTML += createDetailedRow(o); });
                        container.appendChild(sec);
                    }
                }
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
