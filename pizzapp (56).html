// Génère un bloc HTML d'analyse stratégique achat pour une page donnée
function buildStrategicBlock(context) {
  // context: 'purchases' | 'ingredients' | 'recipes' | 'suppliers' | 'dashboard'
  const lines = [];

  if (context === 'purchases' || context === 'dashboard') {
    // Alertes hausses de prix > 10% sur 2 derniers achats
    const alerts = [];
    db.ingredients.forEach(ing => {
      const purs = db.purchases.filter(p=>p.ingredientId===ing.id&&p.unitPrice>0)
                    .sort((a,b)=>b.date.localeCompare(a.date));
      if (purs.length < 2) return;
      const diff = (purs[0].unitPrice - purs[1].unitPrice) / purs[1].unitPrice * 100;
      if (diff > 10) alerts.push({ name: ing.name, diff: Math.round(diff), last: purs[0].unitPrice, prev: purs[1].unitPrice, unit: ing.unit, supplier: purs[0].supplier });
    });
    if (alerts.length) {
      lines.push({ icon:'📈', color:'#ef4444', title:`${alerts.length} hausse${alerts.length>1?'s':''} de prix détectée${alerts.length>1?'s':''}`,
        body: alerts.map(a=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">
          <span><b>${a.name}</b> (${a.supplier})</span>
          <span style="color:#ef4444;font-weight:700">+${a.diff}% — ${fmt(a.prev)} → ${fmt(a.last)}/${a.unit}</span>
        </div>`).join('')
      });
    }
    // Économies potentielles multi-fournisseurs
    let savings = 0;
    const savingsLines = [];
    db.ingredients.forEach(ing => {
      const allP = getAllSupplierPrices(ing.id);
      if (allP.length < 2) return;
      const best = allP[0], worst = allP[allP.length-1];
      const diff = worst.price - best.price;
      if (diff > 0.05) {
        savings += diff * (ing.minStock/1000);
        savingsLines.push(`<span style="font-size:12px;display:block;padding:2px 0">${ing.name} : ${fmt(best.price)} chez <b>${best.supplier}</b> vs ${fmt(worst.price)} chez ${worst.supplier} → <b style="color:var(--green)">-${fmt(diff)}/${ing.unit}</b></span>`);
      }
    });
    if (savingsLines.length) {
      lines.push({ icon:'💡', color:'#16a34a', title:`Économies potentielles ~${fmt(savings)} (sur stock min.)`,
        body: savingsLines.join('')
      });
    }
  }

  if (context === 'ingredients' || context === 'dashboard') {
    // Ingrédients sans prix
    const noPrix = db.ingredients.filter(i=>getCMP(i.id)===0);
    if (noPrix.length) {
      lines.push({ icon:'⚠️', color:'#f59e0b', title:`${noPrix.length} ingrédient${noPrix.length>1?'s':''} sans prix → coûts sous-estimés`,
        body: `<div style="display:flex;flex-wrap:wrap;gap:4px">${noPrix.map(i=>`<span style="background:rgba(245,158,11,.15);padding:2px 8px;border-radius:6px;font-size:11px">${i.name}</span>`).join('')}</div>`
      });
    }
    // Ingrédients sans fournisseur identifié
    const noSup = db.ingredients.filter(i=>!getBestSupplier(i.id));
    if (noSup.length) {
      lines.push({ icon:'🏪', color:'#6366f1', title:`${noSup.length} ingrédient${noSup.length>1?'s':''} sans fournisseur — liste de courses incomplète`,
        body: `<div style="font-size:12px;color:var(--tx3)">Lie des produits catalogue à ces ingrédients ou enregistre des achats pour les inclure dans la liste de courses.</div>`
      });
    }
  }

  if (context === 'recipes' || context === 'dashboard') {
    // Pizzas sous 70% de marge
    const lowMargin = db.recipes.filter(r=>{
      const cost=recipeCost(r); if(!r.priceSell||!cost)return false;
      return ((r.priceSell-cost)/r.priceSell*100) < 70;
    }).map(r=>{const cost=recipeCost(r);const mg=((r.priceSell-cost)/r.priceSell*100);return{name:r.name,mg:Math.round(mg*10)/10,cost,price:r.priceSell}});
    if (lowMargin.length) {
      lines.push({ icon:'🍕', color:'#e76f51', title:`${lowMargin.length} fiche${lowMargin.length>1?'s':''} avec marge < 70%`,
        body: lowMargin.sort((a,b)=>a.mg-b.mg).map(r=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)">
          <span><b>${r.name}</b></span>
          <span>Coût ${fmt(r.cost)} · Vente ${fmt(r.price)} → <b style="color:${r.mg<60?'#ef4444':'#f59e0b'}">${r.mg}%</b></span>
        </div>`).join('')
      });
    }
    // Meilleure marge
    const bestMargin = db.recipes.filter(r=>r.priceSell&&recipeCost(r)>0)
      .sort((a,b)=>((b.priceSell-recipeCost(b))/b.priceSell)-((a.priceSell-recipeCost(a))/a.priceSell)).slice(0,3);
    if (bestMargin.length) {
      lines.push({ icon:'🏆', color:'#16a34a', title:'Top 3 meilleures marges — à mettre en avant',
        body: bestMargin.map((r,i)=>{const mg=((r.priceSell-recipeCost(r))/r.priceSell*100);return`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span>${['🥇','🥈','🥉'][i]} <b>${r.name}</b></span><span style="color:var(--green);font-weight:700">${mg.toFixed(1)}% · ${fmt(r.priceSell-recipeCost(r))} / pizza</span></div>`}).join('')
      });
    }
  }

  if (context === 'suppliers') {
    // Fournisseur avec plus de 3 produits moins chers que les concurrents
    const supScore = {};
    db.ingredients.forEach(ing => {
      const best = getBestSupplier(ing.id);
      if (!best) return;
      supScore[best.supplier] = (supScore[best.supplier]||0) + 1;
    });
    if (Object.keys(supScore).length) {
      const sorted = Object.entries(supScore).sort((a,b)=>b[1]-a[1]);
      lines.push({ icon:'🏆', color:'#16a34a', title:'Meilleur rapport qualité-prix par fournisseur',
        body: sorted.map(([sup,nb])=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0"><span><b>${sup}</b></span><span style="color:var(--green)">${nb} produit${nb>1?'s':''} moins cher${nb>1?'s':''}</span></div>`).join('')
      });
    }
  }

  if (!lines.length) return '';

  return `<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:20px">
    <div style="font-weight:700;font-size:13px;margin-bottom:12px;display:flex;align-items:center;gap:8px">
      <span style="background:rgba(231,111,81,.12);padding:4px 10px;border-radius:8px;color:var(--accent)">🎯 Analyse stratégique</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      ${lines.map(l=>`<div style="background:var(--hover);border-left:3px solid ${l.color};border-radius:0 8px 8px 0;padding:10px 12px">
        <div style="font-weight:600;font-size:12px;color:${l.color};margin-bottom:6px">${l.icon} ${l.title}</div>
        ${l.body}
      </div>`).join('')}
    </div>
  </div>`;
}

/* getLiveStock — source de stock unifiée et priorisée.
   Priorité : RTDB Firebase > inventaire manuel > rien
   Déduit ensuite les consommations live du KDS (service en cours). */
function getLiveStock() {
  // Rassembler toutes les dates connues (RTDB + local)
  const rtdbDates  = Object.keys(rtdbInventoryData);
  const localDates = [...new Set(db.inventories.map(i=>i.date))];
  const allDates   = [...new Set([...rtdbDates,...localDates])].sort().reverse();
  const lastDate   = allDates[0] || null;
  const hasRTDB    = rtdbDates.length > 0;

  const stock = {}; // { ingId: { qty, source, date } }

  if (lastDate) {
    // Base locale pour cette date
    db.inventories.filter(i=>i.date===lastDate)
      .forEach(i=>{ stock[i.ingredientId] = { qty: i.realQty, source:'local', date:lastDate }; });
    // RTDB écrase le local (prioritaire)
    Object.entries(rtdbInventoryData[lastDate]||{}).forEach(([ingId,qty])=>{
      stock[ingId] = { qty: parseFloat(qty)||0, source:'rtdb', date:lastDate };
    });
  }

  // Déduire les consommations live du KDS (service actuel)
  Object.entries(liveConsumptions).forEach(([ingId, consumed])=>{
    if (stock[ingId]) {
      stock[ingId].qty = Math.max(0, stock[ingId].qty - consumed);
      stock[ingId].liveDeducted = consumed;
    }
  });

  return { stock, lastDate, hasRTDB };
}

function openShoppingList() {
  const { stock: liveStock, lastDate, hasRTDB } = getLiveStock();
  const hasAnyStock = Object.keys(liveStock).length > 0;

  // Pivot : consommations seulement depuis la date du dernier inventaire
  const pivotSales = lastDate ? db.sales.filter(s=>s.date>=lastDate) : db.sales;
  const pivotCons  = getConsumption(pivotSales); // inclut maintenant la pâte maison

  const bySupplier  = {};
  const noSupplier  = [];
  let   totalEstimated = 0;

  db.ingredients.forEach(ing => {
    let realStock;
    if (liveStock[ing.id] !== undefined) {
      realStock = liveStock[ing.id].qty;
    } else if (hasAnyStock) {
      return; // non inventorié → on ne commande pas sans données
    } else {
      realStock = null; // aucune source → commande le mini complet
    }

    const minStock = ing.minStock || 0;
    const needed   = realStock !== null ? Math.max(0, minStock - realStock) : minStock;
    if (needed <= 0 && realStock !== null) return; // stock suffisant

    const best  = getBestSupplier(ing.id);
    const allP  = getAllSupplierPrices(ing.id);
    const hasLiveDed = liveStock[ing.id]?.liveDeducted > 0;
    const entry = { ing, best, allP, realStock, minStock, needed, hasLiveDed };
    if (!best) { noSupplier.push(entry); return; }
    if (!bySupplier[best.supplier]) bySupplier[best.supplier] = [];
    bySupplier[best.supplier].push(entry);
    if (best.price && needed>0) totalEstimated += best.price * needed / 1000;
  });

  const suppliers  = Object.keys(bySupplier).sort();
  const totalItems = Object.values(bySupplier).reduce((s,v)=>s+v.length,0);

  const listHTML = suppliers.map(sup=>{
    const items    = bySupplier[sup];
    const supTotal = items.reduce((s,{best,needed})=>s+(best&&needed>0?best.price*needed/1000:0),0);
    return `<div style="margin-bottom:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:#fff;border-radius:10px 10px 0 0;padding:10px 14px">

          ${supTotal>0?`<div style="font-weight:700">${fmt(supTotal)}</div>`:''}
        </div>
      </div>
      <table style="width:100%;border-collapse:collapse;border:1px solid var(--border);border-top:none">
        <thead><tr style="background:var(--hover);font-size:11px;color:var(--tx3)">
          <th style="text-align:left;padding:6px 10px">Ingrédient</th>
          <th style="text-align:right;padding:6px 10px">Stock réel</th>
          <th style="text-align:right;padding:6px 10px">Stock mini</th>
          <th style="text-align:right;padding:6px 10px;color:var(--accent)">À commander</th>
          <th style="text-align:right;padding:6px 10px">Prix/u</th>
          <th style="text-align:right;padding:6px 10px">Coût</th>
        </tr></thead>
        <tbody>
        ${items.map(({ing,best,allP,realStock,minStock,needed,hasLiveDed})=>{
          const competitors = allP.filter(p=>p.supplier!==best.supplier);
          const costLine    = best ? best.price*needed/1000 : 0;
          return `<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:7px 10px">
              <div style="font-weight:600">${ing.name}</div>
              ${hasLiveDed?`<div style="font-size:10px;color:#f59e0b">🔴 Déduit service en cours</div>`:''}
              ${competitors.length?`<div style="font-size:10px;color:var(--tx3)">${competitors.map(p=>`${p.supplier} ${fmt(p.price)}`).join(' · ')}</div>`:''}
            </td>
            <td style="padding:7px 10px;text-align:right;font-size:12px;color:${realStock===null?'var(--tx3)':realStock<=minStock*0.25?'#ef4444':'var(--tx2)'}">
              ${realStock!==null?fN(realStock)+' '+ing.unit:'—'}
            </td>
            <td style="padding:7px 10px;text-align:right;font-size:12px;color:var(--tx3)">${fN(minStock)} ${ing.unit}</td>
            <td style="padding:7px 10px;text-align:right;font-weight:700;color:var(--accent);font-size:15px">${fN(needed)} ${ing.unit}</td>
            <td style="padding:7px 10px;text-align:right;font-weight:600;color:var(--green)">${best?fmt(best.price)+'/'+ing.unit:'—'}</td>
            <td style="padding:7px 10px;text-align:right;font-weight:700">${costLine>0?fmt(costLine):'—'}</td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;
  }).join('');

  const unknownHTML = noSupplier.length ? `
    <div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:12px;margin-top:10px">
      <div style="font-weight:600;font-size:13px;color:#b45309;margin-bottom:8px">⚠️ ${noSupplier.length} article(s) sans fournisseur assigné</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${noSupplier.map(({ing,needed})=>`<span style="background:rgba(255,255,255,.07);padding:3px 10px;border-radius:6px;font-size:12px">${ing.name} — ${fN(needed)} ${ing.unit}</span>`).join('')}
      </div>
    </div>` : '';

  openModal('🛒 Liste de courses par fournisseur', `
    <div style="margin-bottom:14px;padding:12px;background:var(--hover);border-radius:10px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-weight:700;font-size:14px">${suppliers.length} fournisseur(s) · ${totalItems} article(s) à commander</div>
        <div style="font-size:11px;margin-top:3px;color:${hasRTDB?'#22c55e':'var(--tx3)'}">
          ${hasRTDB?'🔥 Stock temps réel Firebase':'💾 Dernier inventaire manuel'}${lastDate?' · Réf : '+dDate(lastDate):''}
          ${Object.keys(liveConsumptions).length?` · KDS actif`:''}

            <p style="font-size:12px;margin-top:8px">Rien à commander pour l'instant.</p>
           </div>`
        : listHTML + unknownHTML}
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Fermer</button></div>
  `, true);
}

let rtdb=null;
function initRTDB(){
  if(rtdb)return rtdb;
  try{
    rtdb=firebase.database(firebaseApp);
    return rtdb;
  }catch(e){console.error('RTDB:',e);return null;}
}

function syncRecipesToRTDB(){
  const btn=document.getElementById('btnSyncRecipes');
  const statusEl=document.getElementById('syncStatus');
  if(!initFirebase()){statusEl&&(statusEl.textContent='❌ Firebase non connecté');return;}
  const r=initRTDB();
  if(!r){statusEl&&(statusEl.textContent='❌ RTDB indisponible');return;}
  if(db.recipes.length===0){statusEl&&(statusEl.textContent='⚠️ Aucune fiche technique. Créez-en dans Fiches Techniques.');return;}
  if(btn){btn.disabled=true;btn.textContent='⏳ Synchronisation…';}
  if(statusEl)statusEl.textContent='';
  const payload={
    ingredients:db.ingredients.map(i=>({id:i.id,name:i.name,unit:i.unit,minStock:i.minStock||0,category:i.category})),
    recipes:db.recipes.map(rec=>({id:rec.id,name:rec.name,category:rec.category,items:rec.items.map(it=>({ingredientId:it.ingredientId,qty:it.qty,unit:it.unit}))})),
    syncedAt:Date.now(),syncedBy:'PizzApp'
  };
  r.ref('shop_config/pizzapp_recipes').set(payload)
    .then(()=>{
      if(btn){btn.disabled=false;btn.textContent='🔄 Synchroniser les recettes vers KDS';}
      if(statusEl){statusEl.style.color='#16a34a';const d=new Date();statusEl.textContent=`✅ ${db.recipes.length} recettes · ${db.ingredients.length} ingrédients synchronisés à ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;}

let liveConsumptions={};
let liveConsListener=null;

// Alias : getLiveStock() utilise rtdbInventoryData, l'inventaire utilise invRtdbData
// On les unifie ici → une seule source de vérité
Object.defineProperty(window, 'rtdbInventoryData', {
  get: function() { return typeof invRtdbData !== 'undefined' ? invRtdbData : {}; },
  configurable: true
});

function startStocksLiveListener(onUpdate){
  if(!initFirebase())return;
  const r=initRTDB();if(!r)return;
  const today=new Date().toISOString().slice(0,10);
  // Nettoyer l'ancien listener proprement
  if(liveConsListener){
    try{ liveConsListener.off(); }catch(e){}
    liveConsListener=null;
  }
  const ref=r.ref('stocks/consumptions/'+today);
  liveConsListener=ref;
  ref.on('value',snap=>{
    const data=snap.val()||{};
    const totals={};
    Object.values(data).forEach(order=>{
      if(!order||!order.items)return;
      order.items.forEach(item=>{
        if(!totals[item.ingredientId])totals[item.ingredientId]=0;
        totals[item.ingredientId]+=(item.consumed_kg||0);
      });
    });
    liveConsumptions=totals;
    console.log('🔴 Stocks Live update:', Object.keys(totals).length, 'ingrédients consommés');
    if(onUpdate)onUpdate();
  }, err=>{
    console.error('Stocks Live listener error:', err);
  });
}

function syncFromSL(){
  if(!initFirebase()){toast('Firebase non connecté','error');return;}
  const r=initRTDB();
  if(!r||db.recipes.length===0){toast('Aucune recette à synchroniser','error');return;}
  const payload={
    ingredients:db.ingredients.map(i=>({id:i.id,name:i.name,unit:i.unit,minStock:i.minStock||0})),
    recipes:db.recipes.map(rec=>({id:rec.id,name:rec.name,items:rec.items.map(it=>({ingredientId:it.ingredientId,qty:it.qty,unit:it.unit}))})),
    syncedAt:Date.now(),syncedBy:'PizzApp'
  };
  r.ref('shop_config/pizzapp_recipes').set(payload)
    .then(()=>toast(`✅ ${db.recipes.length} recettes synchronisées`,'success'))
    .catch(e=>toast('Erreur : '+e.message,'error'));
}

async function refreshDriveAccessToken() {
  const refreshToken = db.config.driveRefreshToken;
  const clientId = db.config.driveClientId;
  if (!refreshToken || !clientId) return false;
  try {
    const resp = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({
        client_id: clientId,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      })
    });
    const data = await resp.json();
    if (!resp.ok || !data.access_token) {
      console.error('Drive refresh failed', data);
      return false;
    }
    db.config.driveAccessToken = data.access_token;
    db.config.driveTokenExpiry = Date.now() + ((parseInt(data.expires_in, 10) || 3600) * 1000);
    if (data.refresh_token) db.config.driveRefreshToken = data.refresh_token;
    saveDB();
    return true;
  } catch (e) {
    console.error('Drive refresh token error', e);
    return false;
  }
}

async function ensureDriveAccessToken() {
  if (db.config.driveAccessToken && db.config.driveTokenExpiry && Date.now() < db.config.driveTokenExpiry - 60000) {
    return db.config.driveAccessToken;
  }
  if (db.config.driveRefreshToken) {
    const ok = await refreshDriveAccessToken();
    if (ok) return db.config.driveAccessToken;
  }
  return db.config.driveAccessToken || '';
}

async function fetchDriveApi(url, opts = {}) {
  const token = await ensureDriveAccessToken();
  if (!token) throw new Error('Token Drive manquant.');
  const headers = {...(opts.headers || {}), Authorization: 'Bearer ' + token};
  let resp = await fetch(url, {...opts, headers});
  if (resp.status === 401 && db.config.driveRefreshToken) {
    const refreshed = await refreshDriveAccessToken();
    if (refreshed) {
      const retryHeaders = {...(opts.headers || {}), Authorization: 'Bearer ' + db.config.driveAccessToken};
      resp = await fetch(url, {...opts, headers: retryHeaders});
    }
  }
  return resp;
}

// Correspondance floue produit → ingrédient
function matchIngredient(productName) {
  if (!productName) return null;
  const pn = productName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // Cherche d'abord une correspondance exacte
  let best = db.ingredients.find(i => {
    const n = i.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return n === pn || pn.includes(n) || n.includes(pn);
  });
  if (best) return best;
  // Correspondances par mots-clés
  const kwMap = {
    'pate': 'ing01', 'farine': 'ing01',
    'tomate': 'ing02', 'coulis': 'ing02', 'pulpe': 'ing02',
    'mozza': 'ing05', 'mozzarella': 'ing05',
    'emmental': 'ing08',
    'creme': 'ing10', 'crème': 'ing10', 'liquide': 'ing10',
    'olive': 'ing16', 'olives': 'ing16',
    'basilic': 'ing17',
    'champignon': 'ing18',
    'ananas': 'ing19',
    'poivron': 'ing20',
    'pomme de terre': 'ing21', 'pdt': 'ing21',
    'oignon': 'ing22',
    'aubergine': 'ing23',
    'roquette': 'ing24',
    'cive': 'ing25',
    'oeuf': 'ing29', 'œuf': 'ing29',
    'miel': 'ing30',
    'jambon': 'ing31',
    'merguez': 'ing32',
    'lardon': 'ing33',
    'boeuf': 'ing34', 'steak': 'ing34', 'viande': 'ing34',
    'bacon': 'ing35',
    'pepperoni': 'ing36',
    'poulet': 'ing37',
    'saucisse': 'ing38',
    'foie gras': 'ing39', 'foie': 'ing39',
    'kebab': 'ing40',
    'marlin': 'ing41',
    'saumon': 'ing42',
    'crevette': 'ing43',
  };
  for (const [kw, id] of Object.entries(kwMap)) {
    if (pn.includes(kw)) return db.ingredients.find(i => i.id === id);
  }
  return null;
}

// ── Traiter la file d'attente ─────────────────────────────────────────────
async function processDriveQueue() {
  if (!db.config.anthropicApiKey) { toast('Clé Anthropic requise','error'); return; }
  if (driveQueue.length === 0) { toast('Aucun fichier sélectionné','error'); return; }
  driveProcessing = true;
  renderDrivePanel(`🤖 Analyse de ${driveQueue.length} fichier(s)…`);

  const queue = [...driveQueue];
  let done = 0;

  for (const fileId of queue) {
    const file = driveFiles.find(f => f.id === fileId);
    if (!file) continue;
    renderDrivePanel(`📄 Analyse ${done+1}/${queue.length} : ${file.name}…`);
    try {
      // 1. Télécharger le fichier depuis Drive
      const dlResp = await fetchDriveApi(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
      if (!dlResp.ok) throw new Error('Téléchargement échoué : ' + dlResp.status);
      const blob = await dlResp.blob();
      const b64  = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload  = () => res(r.result.split(',')[1]);
        r.onerror = () => rej(new Error('Lecture fichier'));
        r.readAsDataURL(blob);
      });
      const mt = file.mimeType || 'application/pdf';

      // 2. Envoyer à Claude Vision
      const aiResp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': db.config.anthropicApiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 2000,
          messages: [{
            role: 'user',
            content: [
              { type: mt === 'application/pdf' ? 'document' : 'image',
                source: { type: 'base64', media_type: mt, data: b64 } },
              { type: 'text', text: `Tu es un expert en lecture de factures fournisseur pour la restauration (pizzeria en Martinique).\nExtrais TOUS les articles/produits de cette facture.\nRéponds UNIQUEMENT avec un JSON valide (sans markdown, sans backticks) :\n{"supplier":"nom fournisseur","invoice_date":"YYYY-MM-DD","items":[{"product":"nom produit","qty":nombre,"unit":"kg ou L ou piece","unit_price":nombre,"total_price":nombre}]}\nRègles strictes :\n- Prix en euros avec point décimal (ex: 12.50)\n- qty = quantité achetée (nombre)\n- Si pas de date ou fournisseur, mets ""\n- N'invente RIEN, ignore TVA/totaux/remises\n- Inclus TOUS les produits alimentaires de la facture` }
            ]
          }]
        })
      });
      if (!aiResp.ok) throw new Error('Claude API : ' + aiResp.status);
      const aiData = await aiResp.json();
      const text   = aiData.content?.map(c => c.text || '').join('') || '';
      const clean  = text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);

      // 3. Pré-matcher les ingrédients
      parsed.items = (parsed.items || []).map(item => ({
        ...item,
        _ingId: matchIngredient(item.product)?.id || ''
      }));

      driveResults.push({ ...parsed, fileId, fileName: file.name });
      driveQueue = driveQueue.filter(id => id !== fileId);
      done++;
    } catch(e) {
      console.error(`Erreur fichier ${file.name}:`, e);
      driveQueue = driveQueue.filter(id => id !== fileId);
      done++;
    }
  }

  driveProcessing = false;
  renderDrivePanel(done > 0 ? `✅ ${done} facture(s) analysée(s). Vérifie et valide ci-dessous.` : '⚠️ Aucune facture traitée.');
}

// ── Importer un résultat validé ───────────────────────────────────────────
function importDriveResult(ri) {
  const res = driveResults[ri];
  if (!res) return;
  const date     = res.invoice_date || today();
  const supplier = res.supplier || 'Drive';
  let purchaseCount  = 0;
  let catalogCount   = 0;

  res.items.forEach(item => {
    const qty   = parseFloat(item.qty)    || 0;
    const price = parseFloat(item.unit_price) || 0;
    const total = parseFloat(item.total_price || (qty * price)) || 0;

    // 1. Toujours enregistrer dans le catalogue (tous produits)
    const catalogProd = findOrCreateCatalogProduct(
      item.product, supplier, item.unit,
      price > 0 ? price : (qty > 0 && total > 0 ? total/qty : 0),
      date
    );
    catalogCount++;

    // 2. Si lié à un ingrédient (via catalogue ou choix manuel dans le panel)
    const ingId = item._ingId || catalogProd.linkedIngredientId;
    if (ingId && qty && total) {
      db.purchases.push({
        id:          uid(),
        date,
        ingredientId: ingId,
        qty,
        totalPrice:  total,
        unitPrice:   qty > 0 ? total / qty : 0,
        supplier,
        notes:       `Import Drive: ${res.fileName}`
      });
      purchaseCount++;
    }
  });

  // Marquer comme traité
  if (!db.config.driveProcessedFiles) db.config.driveProcessedFiles = [];
  db.config.driveProcessedFiles.push(res.fileId);
  driveResults.splice(ri, 1);
  saveDB();
  renderPurchases();
  toast(`✅ ${catalogCount} produit(s) dans le catalogue · ${purchaseCount} achat(s) en stock`, 'success');
}

let subRecipeItems = []; // items en cours d'édition

// Trouver un ingrédient par ID ou par nom (fallback)
function resolveIngredient(ingredientId) {
  // 1. Recherche exacte par ID
  let ing = db.ingredients.find(i => i.id === ingredientId);
  if (ing) return ing;
  // 2. Si l'ID ressemble à "ing50"-"ing56", chercher par nom approché
  const nameMap = {
    'ing50': 'farine', 'ing51': 'sel', 'ing52': 'sucre',
    'ing53': 'lait',   'ing54': 'levure', 'ing55': 'vinaigre',
    'ing56': "huile d'olive"
  };
  const target = nameMap[ingredientId];
  if (target) {
    ing = db.ingredients.find(i => i.name.toLowerCase().includes(target));
    if (ing) return ing;
  }
  return null;
}

// Réconciliation automatique : relink les items par nom
function reconcileSubRecipe(sub) {
  let fixed = 0;
  sub.items = sub.items.map(it => {
    const direct = db.ingredients.find(i => i.id === it.ingredientId);
    if (direct) return it; // OK, déjà lié
    const fallback = resolveIngredient(it.ingredientId);
    if (fallback) {
      fixed++;
      return { ...it, ingredientId: fallback.id };
    }
    return it;
  });
  return fixed;
}

function renderSRIngList() {
  const el = document.getElementById('srIngList');

  if (subRecipeItems.length === 0) {
    el.innerHTML = '<div style="color:var(--tx3);font-size:12px;text-align:center;padding:10px">Aucun ingrédient — ajoutez-en ci-dessous</div>';
    return;
  }
  el.innerHTML = subRecipeItems.map((it, i) => {
    const ing = db.ingredients.find(x => x.id === it.ingredientId);
    const missing = !ing;
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--hover);border-radius:8px;${missing?'border:1px solid #ef4444':''}">

        <option value="">— choisir —</option>
        ${db.ingredients.sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}" ${x.id===it.ingredientId?'selected':''}>${x.name}</option>`).join('')}
      </select>
      <input type="number" value="${it.qty}" step="any" onchange="subRecipeItems[${i}].qty=parseFloat(this.value)||0" style="width:70px;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:4px;background:var(--card);color:var(--tx)">
      <select onchange="subRecipeItems[${i}].unit=this.value" style="width:60px;font-size:12px;border:1px solid var(--border);border-radius:6px;padding:4px;background:var(--card);color:var(--tx)">
        ${optionsHTML(UNITS, it.unit)}
      </select>
      <button onclick="subRecipeItems.splice(${i},1);renderSRIngList()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;flex-shrink:0" title="Supprimer">✕</button>
    </div>`;
  }).join('');
}

function addSubRecipeItem() {
  const ingId = document.getElementById('srNewIng')?.value;
  const qty   = parseFloat(document.getElementById('srNewQty')?.value);
  const unit  = document.getElementById('srNewUnit')?.value || 'g';
  if (!ingId) { toast('Choisissez un ingrédient', 'error'); return; }
  if (!qty || qty <= 0) { toast('Quantité requise', 'error'); return; }
  subRecipeItems.push({ ingredientId: ingId, qty, unit });
  document.getElementById('srNewQty').value = '';
  renderSRIngList();
}

function saveSubRecipe(subId) {
  const sub = (db.subRecipes||[]).find(s => s.id === subId);
  if (!sub) return;
  const name   = document.getElementById('srName')?.value?.trim();
  const yld    = parseInt(document.getElementById('srYield')?.value) || 45;
  const weight = parseInt(document.getElementById('srWeight')?.value) || 340;
  const notes  = document.getElementById('srNotes')?.value?.trim() || '';
  if (!name) { toast('Nom requis', 'error'); return; }
  if (subRecipeItems.length === 0) { toast('Ajoutez au moins un ingrédient', 'error'); return; }
  sub.name        = name;
  sub.yield       = yld;
  sub.yieldWeightG= weight;
  sub.notes       = notes;
  sub.items       = subRecipeItems.filter(it => it.ingredientId && it.qty > 0);
  saveDB();
  closeModal();
  renderRecipes();
  toast('✅ Pâte à pizza mise à jour', 'success');
}

function buildAgentContext() {
  const now = new Date();
  const since30 = new Date(now - 30*864e5).toISOString().slice(0,10);
  const since90 = new Date(now - 90*864e5).toISOString().slice(0,10);

  // Dépenses par fournisseur (30j et 90j)
  const pur30 = db.purchases.filter(p => p.date >= since30);
  const pur90 = db.purchases.filter(p => p.date >= since90);
  const bySupplier = {};
  db.purchases.forEach(p => {
    if (!bySupplier[p.supplier]) bySupplier[p.supplier] = {total:0, count:0, items:[]};
    bySupplier[p.supplier].total += p.totalPrice;
    bySupplier[p.supplier].count++;
    bySupplier[p.supplier].items.push(p.ingredientId);
  });

  const totalSpend = Object.values(bySupplier).reduce((s,v)=>s+v.total,0);

  // Alertes de prix depuis le catalogue
  const alerts = [];
  db.catalog.forEach(prod => {
    if (!prod.priceHistory || prod.priceHistory.length < 2) return;
    const sorted = [...prod.priceHistory].sort((a,b)=>a.date.localeCompare(b.date));
    const last = sorted[sorted.length-1];
    const prev = sorted[sorted.length-2];
    const pct = ((last.price - prev.price) / prev.price) * 100;
    if (Math.abs(pct) > 10) alerts.push(`${prod.name} (${prod.supplier}): ${pct>0?'+':''}${pct.toFixed(1)}% entre ${prev.date} et ${last.date}`);
  });

  // Prix actuels par ingrédient
  const ingPrices = db.ingredients.map(i => {
    const cmp = getCMP(i.id);
    const purList = db.purchases.filter(p=>p.ingredientId===i.id).sort((a,b)=>b.date.localeCompare(a.date));
    const lastPur = purList[0];
    const sups = [...new Set(purList.map(p=>p.supplier))];
    return `- ${i.name} (${i.unit}): CMP ${cmp.toFixed(3)}€ | Fournisseurs: ${sups.join(', ')||'N/A'}${lastPur?` | Dernier achat: ${lastPur.totalPrice.toFixed(2)}€ le ${lastPur.date}`:''}`;
  }).join('\n');

  // Catalogue produits avec derniers prix
  const catPrices = db.catalog.slice(0,30).map(p => {
    const price = getCatalogPrice ? getCatalogPrice(p) : null;
    return `- ${p.name} | ${p.category} | ${p.supplier||'?'} | Réf: ${p.supplierRef||'N/A'} | Prix: ${price?price.toFixed(2)+'€':'N/C'}`;
  }).join('\n');

  return `
=== CONTEXTE MWAKA PIZZA ===
Date: ${now.toLocaleDateString('fr-FR')}
Restaurants: La Savoureuse 1 & 2, MFood 1 & 2

=== FOURNISSEURS ACTIFS ===
${db.suppliers.join(', ')}

=== DÉPENSES PAR FOURNISSEUR (historique complet) ===
Total des achats enregistrés: ${totalSpend.toFixed(2)}€
${Object.entries(bySupplier).sort((a,b)=>b[1].total-a[1].total).map(([sup,v])=>`- ${sup}: ${v.total.toFixed(2)}€ (${((v.total/totalSpend)*100).toFixed(1)}% du total, ${v.count} lignes)`).join('\n')}

=== INGRÉDIENTS & PRIX (${db.ingredients.length} références) ===
${ingPrices}

=== ALERTES DE PRIX DÉTECTÉES ===
${alerts.length > 0 ? alerts.join('\n') : 'Aucune alerte de variation de prix significative'}

=== CATALOGUE FOURNISSEURS (${db.catalog.length} produits) ===
${catPrices}
${db.catalog.length > 30 ? `... et ${db.catalog.length - 30} autres produits` : ''}

=== ACHATS RÉCENTS (30 derniers jours: ${pur30.length} lignes) ===
${pur30.slice(-20).map(p=>{const i=db.ingredients.find(x=>x.id===p.ingredientId);return `- ${i?.name||p.ingredientId} | ${p.supplier} | ${p.totalPrice.toFixed(2)}€ | ${p.date}`}).join('\n')||'Aucun achat récent'}
`.trim();
}

function renderAgentMessage(msg) {
  const isUser = msg.role === 'user';
  return `
    <div style="display:flex;gap:10px;align-items:flex-start;${isUser?'flex-direction:row-reverse':''}">

      <div style="max-width:80%;background:var(--card);border:1px solid var(--border);border-radius:${isUser?'14px 4px 14px 14px':'4px 14px 14px 14px'};padding:12px 16px;${isUser?'background:rgba(231,111,81,.12);border-color:rgba(231,111,81,.3)':''}">
        <div style="font-size:13.5px;line-height:1.65;color:var(--tx);white-space:pre-wrap">${agentFormatResponse(msg.content)}</div>
        ${msg.time ? `<div style="font-size:10px;color:var(--tx3);margin-top:6px;text-align:right">${msg.time}</div>` : ''}
      </div>
    </div>
  `;
}

function agentFormatResponse(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // Titres markdown
    .replace(/^### (.+)$/gm,'<strong style="font-size:14px;display:block;margin-top:10px;margin-bottom:4px;color:var(--tx)">$1</strong>')
    .replace(/^## (.+)$/gm,'<strong style="font-size:15px;display:block;margin-top:12px;margin-bottom:6px;color:var(--tx)">$1</strong>')
    .replace(/^# (.+)$/gm,'<strong style="font-size:16px;display:block;margin-top:4px;margin-bottom:8px;color:var(--tx)">$1</strong>')
    // Tableaux markdown → HTML simple
    .replace(/\|(.+)\|/g, (match) => {
      const cells = match.split('|').filter(c=>c.trim());
      return '<span style="display:block;font-family:monospace;font-size:12px;background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px;margin:1px 0">' + cells.map(c=>c.trim()).join(' │ ') + '</span>';
    })
    .replace(/^---+$/gm,'<hr style="border:none;border-top:1px solid var(--border);margin:8px 0">')
    // Bold
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    // Italic
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    // Listes
    .replace(/^- (.+)$/gm,'<span style="display:block;padding-left:16px">• $1</span>')
    .replace(/^\d+\. (.+)$/gm,'<span style="display:block;padding-left:16px">$1</span>');
}

function agentKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); agentSend(); }
}

function agentSend() {
  const input = document.getElementById('agentInput');

}

async function sendAgentMessage(userMsg) {
  if (!db.config.anthropicApiKey) { toast('Clé Anthropic requise dans Paramètres', 'error'); return; }
  if (agentLoading) return;

  const time = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
  agentHistory.push({role:'user', content:userMsg, time});
  agentLoading = true;
  renderAgent();

  // Scroll auto
  setTimeout(() => {
    const conv = document.getElementById('agentConv');
    if (conv) conv.scrollTop = conv.scrollHeight;
  }, 50);

  try {
    const context = buildAgentContext();

    // Construire l'historique pour l'API (sans le contexte pour ne pas surcharger)
    const apiMessages = [];

    // Premier message : injecter le contexte des données
    if (agentHistory.length === 1) {
      apiMessages.push({
        role: 'user',
        content: `[DONNÉES PIZZAPP EN TEMPS RÉEL]\n${context}\n\n[QUESTION]\n${userMsg}`
      });
    } else {
      // Pour les messages suivants, inclure l'historique + re-injecter le contexte
      apiMessages.push({
        role: 'user',
        content: `[DONNÉES PIZZAPP EN TEMPS RÉEL]\n${context}\n\n[FIN DES DONNÉES]\n\n${agentHistory[0]?.content}`
      });
      for (let i = 1; i < agentHistory.length; i++) {
        const m = agentHistory[i];
        if (m.role === 'assistant') {
          apiMessages.push({role:'assistant', content:m.content});
        } else if (i < agentHistory.length - 1) {
          apiMessages.push({role:'user', content:m.content});
        } else {
          apiMessages.push({role:'user', content:m.content});
        }
      }
    }

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': db.config.anthropicApiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        system: AGENT_SYSTEM_PROMPT,
        messages: apiMessages
      })
    });

    const data = await resp.json();
    if (data.error) throw new Error(data.error.message);

    const aiTime = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
    const aiContent = data.content[0]?.text || 'Pas de réponse';
    agentHistory.push({role:'assistant', content:aiContent, time:aiTime});

  } catch(err) {
    agentHistory.push({role:'assistant', content:`❌ Erreur : ${err.message}\n\nVérifie ta clé API dans Paramètres.`, time:''});
  }

  agentLoading = false;
  renderAgent();
  setTimeout(() => {
    const conv = document.getElementById('agentConv');
    if (conv) conv.scrollTop = conv.scrollHeight;
  }, 100);
}
