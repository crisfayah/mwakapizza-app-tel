<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PizzApp — Gestion Pizzeria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f5f0eb;--card:#fff;--sidebar:#1a1512;--hover:#f0e9e1;--input:#faf8f5;
  --border:#e5ddd4;--tx:#1a1512;--tx2:#6b5e52;--tx3:#9c8e80;
  --accent:#e76f51;--accent-lt:#fde8e0;--accent-dk:#c45a3f;
  --green:#16a34a;--red:#dc2626;--yellow:#f59e0b;--purple:#7c3aed;--orange:#ea580c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit','DM Sans',sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}

/* ── Sidebar ── */
#sidebar{width:230px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s;overflow:hidden}
#sidebar.collapsed{width:60px}
.sb-header{padding:22px 18px;display:flex;align-items:center;gap:10}
.sb-toggle{background:none;border:none;color:#fff;padding:4px;font-size:20px}
.sb-logo{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.5px;white-space:nowrap}
.sb-logo span{color:var(--accent)}
.sb-sub{font-size:9px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:2px;margin-top:1px}
#sidebar.collapsed .sb-logo,#sidebar.collapsed .sb-sub,#sidebar.collapsed .nav-label,#sidebar.collapsed .sb-footer{display:none}
.sb-nav{flex:1;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:none;font-size:13.5px;font-weight:500;background:transparent;color:rgba(255,255,255,.55);transition:all .2s;width:100%;text-align:left;white-space:nowrap}
.nav-btn:hover{color:rgba(255,255,255,.8)}
.nav-btn.active{background:rgba(231,111,81,.15);color:#e76f51;font-weight:700}
#sidebar.collapsed .nav-btn{justify-content:center;padding:10px 0}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.25);font-size:10px;white-space:nowrap}

/* ── Main ── */
#main{flex:1;overflow-y:auto;padding:28px 36px}
.page{display:none}.page.active{display:block}
h1.page-title{font-size:26px;font-weight:800;font-family:'DM Sans',sans-serif;color:var(--tx)}
.page-sub{color:var(--tx2);font-size:13.5px;margin-top:3px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}

/* ── Cards ── */
.stat-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.stat-card{background:var(--card);border-radius:14px;padding:18px 22px;flex:1;min-width:180px;border:1px solid var(--border)}
.stat-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.stat-val{font-size:23px;font-weight:800;font-family:'DM Sans',sans-serif}
.stat-label{font-size:12.5px;color:var(--tx2);margin-top:2px}
.stat-sub{font-size:11px;color:var(--tx3);margin-top:3px}

/* ── Buttons ── */
.btn{border:none;border-radius:10px;font-weight:600;font-size:13.5px;padding:9px 18px;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--hover);color:var(--tx)}
.btn-danger{background:#fee2e2;color:var(--red)}
.btn-ghost{background:transparent;color:var(--tx2);padding:6px 10px}
.btn-purple{background:var(--purple);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{font-size:12px;padding:5px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ── Inputs ── */
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px}
.field input,.field select{border:2px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13.5px;background:var(--input);color:var(--tx);outline:none;transition:border .2s}
.field input:focus,.field select:focus{border-color:var(--accent)}
.search-wrap{position:relative;flex:1}
.search-wrap input{width:100%;padding-left:36px}
.search-wrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px}

/* ── Table ── */
.tbl-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead tr{background:var(--hover)}
th{padding:11px 14px;text-align:left;font-weight:700;color:var(--tx2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:11px 14px;white-space:nowrap}
tbody tr{border-top:1px solid var(--border);transition:background .15s}
tbody tr:hover{background:var(--hover)}
.text-right{text-align:right}
.fw600{font-weight:600}
.fw700{font-weight:700}
.badge{padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:700;text-transform:uppercase;display:inline-block}
.badge-csv{background:#dbeafe;color:#1e40af}
.badge-zelty{background:#fae8ff;color:#86198f}
.badge-mwaka{background:#d1fae5;color:#065f46}
.badge-cat{background:var(--hover);font-size:11px;font-weight:600}
.badge-ok{background:#d1fae5;color:#065f46}
.badge-no{color:var(--tx3)}
.clr-accent{color:var(--accent)}.clr-green{color:var(--green)}.clr-red{color:var(--red)}.clr-yellow{color:var(--yellow)}
.empty-row{padding:30px;text-align:center;color:var(--tx3);font-size:13.5px}

/* ── Grid & Charts ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.chart-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border)}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:14px}
.filter-row{display:flex;gap:10px;margin-bottom:18px;align-items:flex-end;flex-wrap:wrap}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.modal-box{position:relative;background:var(--card);border-radius:16px;padding:26px 30px;width:min(540px,94vw);max-height:86vh;overflow-y:auto;box-shadow:0 20px 48px rgba(0,0,0,.2)}
.modal-box.wide{width:min(860px,94vw)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h2{font-size:19px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;color:var(--tx2);cursor:pointer}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.modal-footer{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* ── Recipe cards ── */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.recipe-card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:20px 22px;transition:box-shadow .2s}
.recipe-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.06)}
.recipe-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.recipe-name{font-size:17px;font-weight:700}
.recipe-cat{font-size:11.5px;color:var(--accent);font-weight:600}
.recipe-items{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.recipe-item{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2)}
.recipe-item span:last-child{font-weight:600}
.recipe-bottom{border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between;align-items:center}
.recipe-cost-lbl{font-size:10.5px;color:var(--tx3)}
.recipe-cost-val{font-size:17px;font-weight:800;color:var(--accent)}
.recipe-margin-lbl{font-size:10.5px;color:var(--tx3)}
.recipe-margin-val{font-size:15px;font-weight:700}

/* ── Ingredient list in modal ── */
.ing-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.ing-row{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:8px;background:var(--hover)}
.ing-row span:first-child{flex:1;font-weight:600;font-size:13px}
.ing-row span:last-child{font-size:13px}

/* ── CMP cards ── */
.cmp-row{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.cmp-card{background:var(--card);border-radius:11px;padding:11px 15px;border:1px solid var(--border);cursor:pointer;min-width:130px;transition:all .2s}
.cmp-card.active{border:2px solid var(--accent)}
.cmp-name{font-size:11px;color:var(--tx3)}
.cmp-val{font-size:17px;font-weight:800;color:var(--accent)}
.cmp-val small{font-size:10px;color:var(--tx3);font-weight:400}
.cmp-count{font-size:10px;color:var(--tx2)}

/* ── OCR ── */
.ocr-loading{background:var(--card);border-radius:14px;padding:30px;border:2px dashed var(--accent);text-align:center;margin-bottom:18px}
.ocr-result{background:var(--card);border-radius:14px;padding:22px;border:2px solid var(--green);margin-bottom:18px}
.ocr-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
/* ── Drive ── */
@keyframes spin{to{transform:rotate(360deg)}}
.btn-purple{background:#7c3aed;color:#fff}
.btn-purple:hover{background:#6d28d9}

/* ── Connection dots ── */
.conn-row{display:flex;gap:10px;margin-bottom:18px}
.conn-card{flex:1;background:var(--card);border-radius:11px;padding:12px 16px;border:1px solid var(--border);display:flex;align-items:center;gap:9px}
.conn-dot{width:8px;height:8px;border-radius:50%}
.conn-dot.on{background:var(--green)}.conn-dot.off{background:#d1d5db}
.conn-name{font-size:12.5px;font-weight:600}
.conn-status{font-size:11.5px;color:var(--tx3)}

/* ── Tariff grid ── */
.tariff-best{background:#dcfce7;font-weight:700;color:var(--green)}

/* ── Inventory share card ── */
.inv-share{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:14px;padding:22px;margin-bottom:22px;border:1px solid #fbbf24;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.inv-share h3{font-size:15px;font-weight:700;color:#92400e}
.inv-share p{font-size:12.5px;color:#a16207;margin-top:3px}

/* ── Alert card ── */
.alert-item{display:flex;justify-content:space-between;padding:9px 13px;border-radius:10px;background:#fef2f2;border:1px solid #fecaca;margin-bottom:6px}
.alert-item .name{font-weight:600;color:var(--red)}
.alert-item .info{font-size:12.5px;color:#991b1b}

/* ── Settings sections ── */
.settings-section{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--border);margin-bottom:18px}
.settings-section h3{font-size:15px;font-weight:700;margin-bottom:14px}
.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.api-box{padding:14px;border-radius:11px;background:var(--hover)}
.api-title{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.supplier-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.supplier-tag{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;background:var(--hover);font-size:12.5px;font-weight:600}
.supplier-tag button{background:none;border:none;color:var(--tx3);font-size:14px;cursor:pointer;padding:0}
.danger-zone{background:#fef2f2;border-radius:14px;padding:22px;border:1px solid #fecaca}
.danger-zone h3{font-size:15px;font-weight:700;color:var(--red);margin-bottom:8px}

/* ── Toast ── */
#toast{position:fixed;bottom:22px;right:22px;z-index:2000;padding:11px 22px;border-radius:11px;color:#fff;font-size:13.5px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.2);transform:translateY(100px);opacity:0;transition:all .3s}
#toast.show{transform:translateY(0);opacity:1}

/* ── Spinner ── */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.spinner-dark{border-color:var(--border);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  #sidebar{width:60px}#sidebar .sb-logo,#sidebar .sb-sub,#sidebar .nav-label,#sidebar .sb-footer{display:none}
  #sidebar .nav-btn{justify-content:center;padding:10px 0}
  #main{padding:18px 16px}
  .grid-2{grid-template-columns:1fr}.stat-row{flex-direction:column}
  .modal-grid,.modal-grid-3,.api-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sb-header">
    <button class="sb-toggle" onclick="toggleSidebar()">☰</button>
    <div>
      <div class="sb-logo">Pizz<span>App</span></div>
      <div class="sb-sub">Gestion v2</div>
    </div>
  </div>
  <nav class="sb-nav" id="nav"></nav>
  <div class="sb-footer">PizzApp v2.0 — © 2026</div>
</div>

<!-- Main -->
<div id="main">
  <div id="page-dashboard" class="page active"></div>
  <div id="page-sales" class="page"></div>
  <div id="page-stockslive" class="page"></div>
  <div id="page-recipes" class="page"></div>
  <div id="page-ingredients" class="page"></div>
  <div id="page-purchases" class="page"></div>
  <div id="page-tariffs" class="page"></div>
  <div id="page-suppliers" class="page"></div>
  <div id="page-inventory" class="page"></div>
  <div id="page-settings" class="page"></div>
  <div id="page-agent" class="page"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-box" id="modalBox"><div id="modalContent"></div></div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="fileSalesCSV" accept=".csv,.tsv,.txt" style="display:none">
<input type="file" id="filePurchaseCSV" accept=".csv" style="display:none">
<input type="file" id="filePDF" accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none">
<input type="file" id="fileCatalogPDF" accept=".pdf,.jpg,.jpeg,.png,.webp" style="display:none">
<input type="file" id="fileRestore" accept=".json" style="display:none">

<script>
/* ══════════════════════════════════════════════
   DATA LAYER

const DB_KEY="pizzapp_db";
const DB_VERSION=6; // v6 — correction timezone dates ventes (UTC→Martinique)
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n||0);
const fN=(n,d=2)=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:d}).format(n||0);
const pDate=s=>{if(!s)return"";if(s.includes("/")){const p=s.split("/");if(p.length===3)return`${p[2]}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`}return s};
// dDate : affiche une date YYYY-MM-DD en format fr-FR
// IMPORTANT : ne pas faire new Date("2026-04-11") car minuit UTC = 20h la veille en Martinique

  if(!s)return"";
  try{
    const [y,m,d]=String(s).split('-');
    if(y&&m&&d) return `${d}/${m}/${y}`;
    return new Date(s).toLocaleDateString("fr-FR"); // fallback autres formats
  }catch{return s}
};

}

}

let db;
function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(raw){
      const saved=JSON.parse(raw);
      // Migration : si version ancienne ou moins de recettes que la référence → on met à jour recettes + ingrédients
      const def=defaultDB();
      const needsMigration = (saved._version||0) < DB_VERSION;
      if(needsMigration){
        // On garde les données métier (ventes, achats, inventaires, config, fournisseurs)
        // mais on écrase recettes + ingrédients avec la version à jour
        db={
          ...def,
          sales:      saved.sales      || [],
          purchases:  saved.purchases  || def.purchases,
          inventories:saved.inventories|| [],
          suppliers:      saved.suppliers      || def.suppliers,
          customCategories: saved.customCategories || [],
          tariffGrid: saved.tariffGrid || [],
          subRecipes: saved.subRecipes || def.subRecipes,
          catalog:    saved.catalog    || [],
          config:     {...def.config, ...(saved.config||{})},
          _version:   DB_VERSION
        };
        saveDB();
        // v6 — Corriger dates UTC→Martinique : supprimer ventes MWAKA pour re-import propre
        if((saved._version||0) < 6){
          const before = db.sales.length;
          db.sales = db.sales.filter(s => s.source !== 'mwaka');
          const removed = before - db.sales.length;
          if(removed > 0) console.log(`🔄 Migration v6 : ${removed} ventes MWAKA supprimées → re-import avec dates correctes`);
        }
        console.log(`✅ PizzApp migré vers v${DB_VERSION} — ${db.recipes.length} recettes, ${db.ingredients.length} ingrédients`);
        return;
      }
      db={...def,...saved};
      return;
    }
  }catch(e){}
  db=defaultDB();
  db._version=DB_VERSION;
  saveDB();
}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
function parseCSV(text){const lines=text.trim().split(/\r?\n/);if(lines.length<2)return[];const sep=lines[0].includes("\t")?"\t":lines[0].includes(";")?";":",";;const hdr=lines[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());return lines.slice(1).map(l=>{const v=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,""));const o={};hdr.forEach((h,i)=>{o[h]=v[i]||""});return o})}
function ingName(id){return db.ingredients.find(i=>i.id===id)?.name||"?"}
/* ──────────────────────────────────────────────────────────────────
   getCMP — Coût Moyen Pondéré en cascade :
   1. Achats (db.purchases)         → source la plus précise
   2. Historique prix de l'ingrédient (priceHistory)
   3. Produit catalogue lié         → prix importé de facture
   ────────────────────────────────────────────────────────────────── */
function getCMP(ingId) {
  // 1. CMP pondéré depuis les achats
  const p  = db.purchases.filter(x => x.ingredientId === ingId);
  const tq = p.reduce((s,x) => s + (x.qty||0), 0);
  const tc = p.reduce((s,x) => s + (x.totalPrice||0), 0);
  if (tq > 0) return tc / tq;

  // 2. Dernier prix dans l'historique de l'ingrédient
  const ing = db.ingredients.find(i => i.id === ingId);
  if (ing?.priceHistory?.length) {
    const last = [...ing.priceHistory].sort((a,b) => b.date.localeCompare(a.date))[0];
    if (last?.price > 0) return last.price;
  }

  // 3. Dernier prix dans le catalogue lié
  const catProd = (db.catalog||[]).find(c => c.linkedIngredientId === ingId);
  if (catProd) {
    const price = getCatalogPrice(catProd);
    if (price > 0) return price;
  }

  return 0;
}

/* Synchronise tous les produits catalogue → leurs ingrédients liés
   Appelé au chargement pour rattraper les imports antérieurs */
function syncAllCatalogToIngredients() {
  let count = 0;
  (db.catalog||[]).forEach(prod => {
    if (!prod.linkedIngredientId) return;
    const price = getCatalogPrice(prod);
    if (!price) return;
    const ing = db.ingredients.find(i => i.id === prod.linkedIngredientId);
    if (!ing) return;
    if (!ing.priceHistory) ing.priceHistory = [];
    const dateKey = (prod.priceHistory||[]).sort((a,b)=>b.date.localeCompare(a.date))[0]?.date || today();
    const exists  = ing.priceHistory.find(h => h.date === dateKey && Math.abs(h.price - price) < 0.001);
    if (!exists) {
      ing.priceHistory.push({ date: dateKey, price, unit: prod.unit||'kg', supplier: prod.supplier||'' });
      ing.priceHistory.sort((a,b) => b.date.localeCompare(a.date));
      count++;
    }
  });
  if (count > 0) { saveDB(); console.log(`✅ ${count} prix synchronisés catalogue → ingrédients`); }
}
function subRecipeCostPerUnit(sub) {
  let total = 0;
  (sub.items||[]).forEach(it => {
    const ing = resolveIngredient(it.ingredientId); // utilise le fallback par nom
    if (!ing) return;
    let kg;
    const unit = it.unit;
    if (unit === 'kg' || unit === 'L') kg = it.qty;
    else if (unit === 'g' || unit === 'ml') kg = it.qty / 1000;
    else kg = it.qty;
    total += kg * getCMP(ing.id);
  });
  return sub.yield > 0 ? total / sub.yield : 0;
}

function recipeCost(rec){
  let t=0;
  rec.items.forEach(it=>{
    if (it.subRecipeId) {
      // Sous-recette (ex: pâton)
      const sub = (db.subRecipes||[]).find(s=>s.id===it.subRecipeId);
      if (sub) t += subRecipeCostPerUnit(sub) * (it.qty||1);
    } else {
      t += toKg(it.qty,it.unit)*getCMP(it.ingredientId);
    }
  });
  return t;
}
/* getConsumption — quantités consommées (kg) par ingrédient.
   Gère les sous-recettes (pâte maison) :
   1 paton vendu → déduit farine/sel/lait/levure/huile proportionnellement */
function getConsumption(salesList) {
  const c = {};
  const add = (id, kg) => { c[id] = (c[id]||0) + kg; };
  salesList.forEach(s => {
    const r = db.recipes.find(x => x.name===s.article || x.id===s.recipeId);
    if (!r) return;
    r.items.forEach(it => {
      if (it.subRecipeId) {
        // Sous-recette → déduire chaque ingrédient pro rata
        const sub = (db.subRecipes||[]).find(sr => sr.id===it.subRecipeId);
        if (!sub || !sub.yield) return;
        const nbPatons = (it.qty||1) * s.qty;
        sub.items.forEach(si => {
          add(si.ingredientId, toKg(si.qty, si.unit) / sub.yield * nbPatons);
        });
      } else {
        add(it.ingredientId, toKg(it.qty, it.unit) * s.qty);
      }
    });
  });
  return c;
}

    const el = document.getElementById("chartCA"); if(!el)return;

      type:"line",
      plugins:[weatherPlugin],
      data:{labels,datasets:[{label:"CA €",data:caData.map(d=>Math.round(d.ca*100)/100),borderColor:"#e76f51",backgroundColor:"rgba(231,111,81,.1)",fill:true,tension:.3}]},
      options:{
        plugins:{legend:{display:false},weatherData:wData},

        scales:{y:{beginAtZero:true}}

  // Loss chart
  const losses=db.ingredients.map(i=>{const inv=latInv[i.id];if(!inv)return null;const tp=db.purchases.filter(p=>p.ingredientId===i.id).reduce((s,p)=>s+p.qty,0);const tc=cons[i.id]||0;const st=tp-tc;const ec=st-inv.realQty;return Math.abs(ec)>.01?{name:i.name,ecart:Math.round(ec*100)/100}:null}).filter(Boolean).slice(0,6);
  if(dashChartLoss)dashChartLoss.destroy();
  dashChartLoss=new Chart(document.getElementById("chartLoss"),{type:"bar",data:{labels:losses.map(l=>l.name),datasets:[{label:"Écart kg",data:losses.map(l=>l.ecart),backgroundColor:"#f87171",borderRadius:6}]},options:{plugins:{legend:{display:false}}}});
}

function filterSales(){
  const s=(document.getElementById("salesSearch")?.value||"").toLowerCase();
  const from=document.getElementById("salesFrom")?.value||"";
  const to=document.getElementById("salesTo")?.value||"";
  const resto=document.getElementById("salesResto")?.value||"";
  const source=document.getElementById("salesSource")?.value||"";
  return db.sales.filter(x=>{
    if(s && !x.article.toLowerCase().includes(s) && !(x.clientName||"").toLowerCase().includes(s)) return false;
    if(from&&x.date<from)return false;
    if(to&&x.date>to)return false;
    if(resto&&(x.restaurant||"")!==resto)return false;
    if(source&&(x.source||"")!==source)return false;
    return true;
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

/* ── Analyse ── */
function renderSalesAnalyse(){
  const wrap=document.getElementById("salesContent");

  // Période filter
  const periods=[{v:"7",l:"7 jours"},{v:"14",l:"14 jours"},{v:"30",l:"30 jours"},{v:"90",l:"3 mois"},{v:"365",l:"1 an"},{v:"all",l:"Tout"}];
  const curPeriod=document.getElementById("anaPeriod")?.value||"30";

  let sales=db.sales;
  if(curPeriod!=="all"){
    const dFrom=new Date(Date.now()-parseInt(curPeriod)*864e5).toISOString().slice(0,10);
    sales=sales.filter(s=>s.date>=dFrom);
  }

  const totalCA=sales.reduce((s,r)=>s+r.qty*r.unitPrice,0);
  const totalQty=sales.reduce((s,r)=>s+r.qty,0);
  const uniqueDays=[...new Set(sales.map(s=>s.date))].length;
  const avgPerDay=uniqueDays>0?totalCA/uniqueDays:0;

  // Top produits
  const prodMap={};
  sales.forEach(s=>{
    const recipe = db.recipes.find(r => r.name.toLowerCase() === s.article.toLowerCase());
    const cost = recipe ? recipeCost(recipe) * s.qty : 0;
    if(!prodMap[s.article]) prodMap[s.article]={name:s.article,qty:0,ca:0,cost:0};
    prodMap[s.article].qty+=s.qty;
    prodMap[s.article].ca+=s.qty*s.unitPrice;
    prodMap[s.article].cost+=cost;
  });
  const topProd=Object.values(prodMap).sort((a,b)=>b.qty-a.qty);

  // Par jour
  const byDay={};
  sales.forEach(s=>{if(!byDay[s.date])byDay[s.date]={date:s.date,ca:0,qty:0,count:0};byDay[s.date].ca+=s.qty*s.unitPrice;byDay[s.date].qty+=s.qty;byDay[s.date].count++});
  const dayData=Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date));

  // Par semaine
  const byWeek={};
  sales.forEach(s=>{const d=new Date(s.date);const w=getWeekLabel(d);if(!byWeek[w])byWeek[w]={week:w,ca:0,qty:0};byWeek[w].ca+=s.qty*s.unitPrice;byWeek[w].qty+=s.qty});
  const weekData=Object.values(byWeek).sort((a,b)=>a.week.localeCompare(b.week));

  // Par mois
  const byMonth={};
  sales.forEach(s=>{const m=s.date.slice(0,7);if(!byMonth[m])byMonth[m]={month:m,ca:0,qty:0};byMonth[m].ca+=s.qty*s.unitPrice;byMonth[m].qty+=s.qty});
  const monthData=Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month));

  // Par jour de la semaine
  const byDow=[0,0,0,0,0,0,0]; const dowLabels=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  sales.forEach(s=>{const dow=new Date(s.date).getDay();byDow[dow]+=s.qty});

  // Best/worst day
  const bestDay=dayData.length>0?dayData.reduce((a,b)=>a.ca>b.ca?a:b):null;
  const worstDay=dayData.length>1?dayData.reduce((a,b)=>a.ca<b.ca?a:b):null;

  wrap.innerHTML=`
    <div class="filter-row" style="margin-bottom:20px">
      <div class="field"><label>Période</label><select id="anaPeriod" onchange="renderSalesAnalyse()">${periods.map(p=>`<option value="${p.v}"${p.v===curPeriod?" selected":""}>${p.l}</option>`).join("")}</select></div>
    </div>

    <!-- KPIs -->
    <div class="stat-row">
      <div class="stat-card"><div class="stat-icon" style="background:var(--accent-lt)">💰</div><div class="stat-val">${fmt(totalCA)}</div><div class="stat-label">Chiffre d'affaires</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#bbf7d0">📦</div><div class="stat-val">${totalQty}</div><div class="stat-label">Articles vendus</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#dbeafe">📅</div><div class="stat-val">${fmt(avgPerDay)}</div><div class="stat-label">CA moyen / jour</div><div class="stat-sub">${uniqueDays} jours d'activité</div></div>
      <div class="stat-card"><div class="stat-icon" style="background:#fde68a">⭐</div><div class="stat-val">${topProd[0]?.name||"—"}</div><div class="stat-label">Produit #1</div><div class="stat-sub">${topProd[0]?topProd[0].qty+" vendus":""}</div></div>
    </div>

    <!-- Évolution CA -->
    <div class="chart-card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3>📈 Évolution du chiffre d'affaires</h3>
        <div style="display:flex;gap:4px;background:var(--hover);border-radius:8px;padding:2px">
          <button class="btn btn-sm ${(document.getElementById("anaView")?.value||"day")==="day"?"btn-primary":"btn-ghost"}" onclick="document.getElementById('anaView').value='day';renderSalesAnalyse()">Jour</button>
          <button class="btn btn-sm ${(document.getElementById("anaView")?.value)==="week"?"btn-primary":"btn-ghost"}" onclick="document.getElementById('anaView').value='week';renderSalesAnalyse()">Semaine</button>
          <button class="btn btn-sm ${(document.getElementById("anaView")?.value)==="month"?"btn-primary":"btn-ghost"}" onclick="document.getElementById('anaView').value='month';renderSalesAnalyse()">Mois</button>
        </div>
      </div>
      <input type="hidden" id="anaView" value="${document.getElementById("anaView")?.value||"day"}">
      <canvas id="chartEvoCA" height="200"></canvas>
    </div>

    <div class="grid-2">
      <!-- Top 10 produits -->
      <div class="chart-card">
        <h3>🏆 Top 10 produits</h3>
        <canvas id="chartTop10" height="220"></canvas>
      </div>

      <!-- Répartition par jour de semaine -->
      <div class="chart-card">
        <h3>📅 Ventes par jour de semaine</h3>
        <canvas id="chartDow" height="220"></canvas>
      </div>
    </div>

    <!-- Tableau top produits -->
    <div class="chart-card" style="margin-top:16px">

/* ══════════════════════════════════════════════
   MÉTÉO — wttr.in (gratuit, sans clé API)
   Cache en mémoire pour éviter les appels répétés
   ══════════════════════════════════════════════ */
const weatherCache = {}; // { "YYYY-MM-DD": { icon, temp, desc } }

// Emoji météo selon code WMO
function wmoToEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 2) return '⛅';
  if (code <= 3) return '☁️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '🌨️';
  if (code <= 82) return '🌧️';
  if (code <= 99) return '⛈️';
  return '🌡️';
}

async function fetchWeatherForDates(dates) {
  // Filtrer les dates déjà en cache
  const toFetch = dates.filter(d => !weatherCache[d]);
  if (!toFetch.length) return;

  // wttr.in/Fort-de-France — format JSON, données historiques et prévisions
  try {
    const resp = await fetch(
      'https://wttr.in/Fort-de-France?format=j1',
      { cache: 'force-cache' }
    );
    if (!resp.ok) return;
    const data = await resp.json();

    // Extraire les données des 3 jours disponibles
    (data.weather || []).forEach(day => {
      const date = day.date; // "YYYY-MM-DD"
      const maxC = parseInt(day.maxtempC || 0);
      const minC = parseInt(day.mintempC || 0);
      const wmo  = parseInt(day.hourly?.[4]?.weatherCode || 0); // 12h00
      weatherCache[date] = {
        icon: wmoToEmoji(wmo),
        temp: `${Math.round((maxC+minC)/2)}°C`,
        desc: day.hourly?.[4]?.weatherDesc?.[0]?.value || ''
      };
    });
  } catch(e) {
    console.log('Météo indisponible:', e.message);
  }
}

// Labels axe X avec météo si vue par jour
async function buildLabelsWithWeather(evoData, view) {
  if (view !== 'day') return evoData.map(d => view==='week'?d.week:d.month);
  const dates = evoData.map(d => d.date);
  await fetchWeatherForDates(dates);
  return dates.map(d => {
    const w = weatherCache[d];
    return w ? `${dDate(d)} ${w.icon}` : dDate(d);
  });
}

// Plugin Chart.js pour afficher la météo sous les points
const weatherPlugin = {
  id: 'weatherLabels',
  afterDraw(chart) {
    if (!chart.options.plugins?.weatherData?.length) return;
    const ctx   = chart.ctx;
    const meta  = chart.getDatasetMeta(0);
    const wData = chart.options.plugins.weatherData;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '11px sans-serif';
    ctx.fillStyle = 'rgba(120,120,120,0.8)';
    meta.data.forEach((pt, i) => {
      const w = wData[i];
      if (w) ctx.fillText(w.temp, pt.x, chart.chartArea.bottom + 28);
    });
    ctx.restore();
  }
};

async function doFetchZelty(){
  const dateFrom=document.getElementById("zeltyFrom")?.value||"";
  const dateTo=document.getElementById("zeltyTo")?.value||today();
  const prog=document.getElementById("zeltyProgress");
  const status=(msg)=>{if(prog)prog.innerHTML=msg};

  status('<div style="text-align:center;padding:10px"><span class="spinner spinner-dark"></span> Connexion à ZELTY...</div>');

  try{
    let allSales=[];
    let offset=0, hasMore=true, retries=0;

    while(hasMore){
      status(`<div style="text-align:center;padding:10px"><span class="spinner spinner-dark"></span> Chargement... ${allSales.length} articles récupérés</div>`);
      if(offset>0) await new Promise(r=>setTimeout(r,3000));

      const restaurantId=document.getElementById("zeltyRestaurant")?.value||"";

      const res=await fetch("zelty-proxy.php",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({apiKey:db.config.zeltyApiKey,dateFrom,dateTo,limit:100,offset,restaurantId})});
      if(!res.ok) throw new Error("Erreur serveur "+res.status);
      const data=await res.json();

      if(data.error){
        if(data.error.includes("429")){
          retries++;
          if(retries>3){if(allSales.length>0)break;throw new Error("Rate limit. Réessayez dans 2 min.");}
          for(let s=retries*15;s>0;s--){status(`<div style="text-align:center;padding:14px"><div style="font-size:28px;font-weight:800;color:var(--yellow)">${s}s</div><p>⏳ Rate limit (${retries}/3)</p></div>`);await new Promise(r=>setTimeout(r,1000));}
          continue;
        }
        throw new Error(data.error);
      }
      retries=0;

      const orders=data.orders||data.data||[];
      if(orders.length===0){hasMore=false;break}

      // Debug première page
      if(offset===0){
        const first=orders[0];
        console.log("📦 ZELTY clés commande:",Object.keys(first).join(", "));
        if(first.items&&first.items.length>0){
          console.log("📦 ✅ ITEMS TROUVÉS !",first.items.length,"articles. Premier:",JSON.stringify(first.items[0]).slice(0,500));
        } else {
          console.log("📦 ❌ Pas d'items (expand ne fonctionne pas ?)");
        }
      }

      // Map restaurant IDs to names
      const restoNames={"7471":"Savoureuse 1","7366":"Savoureuse 2","8536":"MFood 1","8551":"MFood 2"};

      orders.forEach(o=>{
        const d=(o.created_at||o.closed_at||"").slice(0,10);
        if(dateFrom&&d<dateFrom) return;
        if(dateTo&&d>dateTo) return;

        const restoName=restoNames[String(o.id_restaurant)]||"";
        const items=o.items||[];
        if(items.length>0){
          items.forEach(it=>{
            const name=it.product_name||it.name||it.label||"";
            const qty=parseInt(it.quantity||it.qty||1);
            let price=0;
            if(typeof it.price==="object"&&it.price!==null){
              price=(it.price.final_amount_inc_tax||it.price.amount_inc_tax||it.price.amount||0)/100;
            } else {
              price=parseFloat(it.price||it.unit_price||0);
              if(price>200) price=price/100;
            }
            if(name){
              const recipe=db.recipes.find(r=>r.name.toLowerCase()===name.toLowerCase());
              allSales.push({id:uid(),date:d,article:name,qty,unitPrice:price,source:"zelty",recipeId:recipe?.id||"",restaurant:restoName});
            }
          });
        } else {
          const totalEur=(o.price?.final_amount_inc_tax||0)/100;
          const ref=o.ref||o.display_id||"";
          if(totalEur>0) allSales.push({id:uid(),date:d,article:`Ticket #${ref}`,qty:1,unitPrice:totalEur,source:"zelty",recipeId:"",restaurant:restoName});
        }
      });

      hasMore=orders.length>=100;
      offset+=orders.length;
    }

    if(allSales.length>0){
      const valid=allSales.filter(s=>s.article&&s.unitPrice>0);
      if(!valid.length){status('<div style="text-align:center;padding:14px;color:var(--red)">⚠️ Aucun article exploitable</div>');return}
      db.sales.push(...valid);saveDB();closeModal();renderSales();
      const hasDetail=valid.some(s=>!s.article.startsWith("Ticket #"));
      const ca=valid.reduce((s,v)=>s+v.unitPrice*v.qty,0);
      const selResto=document.getElementById("zeltyRestaurant")?.selectedOptions?.[0]?.text||"Tous";
      toast(`${valid.length} ${hasDetail?"articles":"tickets"} ZELTY — ${fmt(ca)} (${selResto})`,"success");
    } else {
      status('<div style="text-align:center;padding:14px;color:var(--tx3)">Aucune commande pour cette période</div>');
    }
  }catch(err){
    console.error("ZELTY error:",err);
    status(`<div style="text-align:center;padding:10px;color:var(--red)">❌ ${err.message}</div>`);
  }
}

};

// ── Normalisation floue ──────────────────────────────────────────────────────
// Supprime accents, espaces multiples, casse → compare
function stripAccents(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function normalizeArticle(n){
  if(!n) return n;
  const trimmed = n.trim();
  const up = stripAccents(trimmed).toUpperCase().replace(/\s+/g,' ');

  // 1. Correspondance exacte dans la table
  if(ARTICLE_NORMALIZE[up]) return ARTICLE_NORMALIZE[up];
  if(ARTICLE_NORMALIZE[trimmed.toUpperCase()]) return ARTICLE_NORMALIZE[trimmed.toUpperCase()];

  // 2. Correspondance floue contre les noms de recettes PizzApp
  const recipeNames = (db?.recipes||[]).map(r=>r.name);
  for(const rName of recipeNames){
    const rUp = stripAccents(rName).toUpperCase();
    if(rUp === up) return rName;                         // identique sans accents
    if(rUp.replace(/\s/g,'') === up.replace(/\s/g,'')) return rName; // sans espaces
  }

  // 3. Retourner tel quel (avec capitalisation Titlecase si tout en majuscules)
  if(trimmed === trimmed.toUpperCase() && trimmed.length > 2){
    return trimmed.charAt(0) + trimmed.slice(1).toLowerCase()
      .replace(/\b\w/g, c => c.toUpperCase()); // ex: GWO MODEL → Gwo Model
  }
  return trimmed;
}

// ── Décomposition OFFRE FAMILY ───────────────────────────────────────────────
// OFFRE FAMILY → 3 lignes : Mama (OF), Gwo Model (OF), Sirène (OF)
// Chaque ligne est taggée offerFamily:true pour l'affichage
const OFFRE_FAMILY_ITEMS = [
  { article:'Mama',      tag:'(OF)' },
  { article:'Gwo Model', tag:'(OF)' },
  { article:'Sirène',    tag:'(OF)' },
];
const OFFRE_FAMILY_TOTAL = 45; // prix global de l'offre
const OFFRE_FAMILY_UNIT  = OFFRE_FAMILY_TOTAL / OFFRE_FAMILY_ITEMS.length; // ~15€ par item

// Expand une commande : si elle contient OFFRE FAMILY, la remplacer par les 3 items
function expandOrders(orders){
  const result = [];
  orders.forEach(o => {
    const up = stripAccents(o.article||'').toUpperCase().replace(/\s+/g,' ');
    if(up === 'OFFRE FAMILY' || up === 'FAMILY'){
      // Décomposer en 3 lignes avec suffix (OF)
      OFFRE_FAMILY_ITEMS.forEach(fi => {
        const recipe = db.recipes.find(r => r.name === fi.article);
        result.push({
          ...o,
          id: uid(),
          article:  fi.article + ' ' + fi.tag,
          articleClean: fi.article, // nom sans tag pour matching recette
          unitPrice: OFFRE_FAMILY_UNIT,
          recipeId:  recipe?.id || '',
          offerFamily: true,
          offerTag: fi.tag,
        });
      });
    } else {
      result.push(o);
    }
  });
  return result;
}

function parseFirestoreDoc(doc){
  const f=doc.data();
  const orders=[];
  const docId=doc.id;

  // Date
  let dateStr="";
  if(f.createdAt?.toDate){
    dateStr=toMQDate(f.createdAt.toDate());
  } else if(f.createdAt){
    dateStr=toMQDate(new Date(f.createdAt));
  }

  const orderTotal=parseFloat(f.total||f.montant||0);
  const isTest = (f.clientName||'').toUpperCase().includes('TEST');
  const effectiveTotal = isTest ? 0 : orderTotal;
  const items=f.items||[];

  // ── Source réelle ──────────────────────────────────────────────────────────
  // f.type ou f.source peut valoir : "web", "telephone", "tel", "livraison", etc.
  // On transforme en libellé lisible
  const rawSource = (f.source||f.type||f.orderType||f.canal||'').toLowerCase().trim();
  let sourceLabel;
  if(rawSource.includes('web') || rawSource.includes('online') || rawSource.includes('internet')) {
    sourceLabel = 'web';
  } else if(rawSource.includes('tel') || rawSource.includes('phone') || rawSource.includes('appel')) {
    sourceLabel = 'tel';
  } else if(rawSource.includes('livraison') || rawSource.includes('delivery') || rawSource.includes('uber') || rawSource.includes('deliveroo')) {
    sourceLabel = 'livraison';
  } else if(rawSource.includes('sur place') || rawSource.includes('place') || rawSource.includes('resto')) {
    sourceLabel = 'sur place';
  } else {
    sourceLabel = rawSource || 'mwaka';
  }

  // ── Restaurant depuis f.shop ───────────────────────────────────────────────
  const shopRaw = (f.shop||f.restaurant||f.shopId||'').toLowerCase();
  let restaurantLabel;
  if(shopRaw.includes('valmeniere') || shopRaw.includes('valménière') || shopRaw.includes('valmeni')) {
    restaurantLabel = 'Valménière';
  } else if(shopRaw.includes('centre') || shopRaw.includes('centreville') || shopRaw.includes('bord') || shopRaw.includes('cv')) {
    restaurantLabel = 'Centre-Ville';
  } else {
    restaurantLabel = f.shop || f.restaurant || '';
  }

  // ── Nom client ────────────────────────────────────────────────────────────
  const clientName = (f.clientName||f.client||f.name||f.nom||'').trim();

  if(items.length>0){
    const hasPrice=items.some(it=>it.price>0||it.prix>0);
    const totalQty=items.reduce((s,it)=>s+(it.qty||it.quantity||it.quantite||1),0);

    items.forEach(it=>{
      const name=normalizeArticle(it.name||it.productName||it.nom||"");
      const qty=it.qty||it.quantity||it.quantite||1;
      let unitPrice=parseFloat(it.price||it.prix||it.unitPrice||0);
      if(!hasPrice&&effectiveTotal>0&&totalQty>0) unitPrice=effectiveTotal/totalQty;

      if(name){
        const recipe=db.recipes.find(r=>r.name.toLowerCase()===name.toLowerCase());
        orders.push({
          id:          "mwk_"+docId+"_"+uid(),
          date:        dateStr,
          article:     name,
          qty,
          unitPrice,
          source:      sourceLabel,
          restaurant:  restaurantLabel,
          clientName,
          recipeId:    recipe?.id||"",
          _docId:      docId,
          isTest
        });
      }
    });
  }
  return orders;
}

// Écoute temps réel
function startFirebaseListener(){
  if(!initFirebase()||firebaseListenerActive) return;

  // Minuit heure Martinique (UTC-4) pour le filtre Firestore
  // Sans ça, setHours(0,0,0,0) = minuit UTC = 20h la veille en Martinique
  const nowMQ = new Date(new Date().toLocaleString("en-US", {timeZone:"America/Martinique"}));
  const todayStart = new Date();
  todayStart.setTime(todayStart.getTime() - (nowMQ.getHours()*3600 + nowMQ.getMinutes()*60 + nowMQ.getSeconds())*1000 - nowMQ.getMilliseconds());
  // todayStart pointe sur minuit local Martinique converti en UTC Firestore

  console.log("🔥 Démarrage écoute temps réel...");
  firebaseListenerActive=true;

  firestore.collection("commandes")
    .where("createdAt",">=",todayStart)
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot=>{
      let newCount=0;
      snapshot.docChanges().forEach(change=>{
        if(change.type==="added"){
          const docId=change.doc.id;
          // Vérifier si déjà importé
          const alreadyExists=db.sales.some(s=>s._docId===docId);
          if(!alreadyExists){
            const newOrders=expandOrders(parseFirestoreDoc(change.doc));
            if(newOrders.length>0){
              db.sales.push(...newOrders);
              newCount+=newOrders.length;
            }
          }
        }
      });
      if(newCount>0){
        saveDB();
        mwakaLiveCount+=newCount;
        updateLiveIndicator();
        // Rafraîchir la page si on est sur Ventes ou Dashboard
        if(currentPage==="sales") renderSales();
        if(currentPage==="dashboard") renderDashboard();
        toast(`🔥 ${newCount} nouvelle(s) vente(s) MWAKA`,"success");
      }
    },err=>{
      console.error("🔥 Erreur écoute:",err);
      firebaseListenerActive=false;
    });
}

// Indicateur live
function updateLiveIndicator(){
  let el=document.getElementById("liveIndicator");
  if(!el){
    el=document.createElement("div");
    el.id="liveIndicator";
    el.style.cssText="position:fixed;bottom:22px;left:22px;background:#10b981;color:#fff;padding:8px 16px;border-radius:20px;font-size:11px;font-weight:700;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;cursor:pointer";
    el.onclick=()=>{goTo("sales")};
    document.body.appendChild(el);
  }
  el.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 2s infinite"></span> 🔥 MWAKA Live — ${mwakaLiveCount} articles aujourd'hui`;
}

// Import manuel (toutes les commandes, pas seulement aujourd'hui)
async function fetchFirebase(){
  if(!initFirebase()){toast("Erreur initialisation Firebase","error");return}
  const btn=document.getElementById("btnMwaka");btn.disabled=true;btn.innerHTML='<span class="spinner"></span> MWAKA';
  try{
    const snap=await firestore.collection("commandes").orderBy("createdAt","desc").limit(500).get();
    console.log(`Firebase: ${snap.size} commandes récupérées`);

    const orders=[];
    snap.forEach(doc=>{
      const docOrders=parseFirestoreDoc(doc);
      docOrders.forEach(o=>{
        if(!db.sales.some(s=>s._docId===doc.id&&s.article===o.article)){
          orders.push(o);
        }
      });
    });

    if(orders.length>0){
      const expanded=expandOrders(orders);
      db.sales.push(...expanded);saveDB();renderSales();
      toast(`${orders.length} ventes importées (${snap.size} commandes)`,"success");
    } else {
      toast(`${snap.size} commandes lues, aucune nouvelle vente à importer`,"info");
    }
  }catch(err){console.error(err);toast("Erreur Firebase: "+err.message,"error")}
  btn.disabled=false;btn.innerHTML="📡 MWAKA";
  // Démarrer le listener temps réel après le premier import
  startFirebaseListener();
}

      const mt=file.type==="application/pdf"?"application/pdf":file.type.startsWith("image/")?file.type:"application/pdf";

            {type:"text",text:`Tu es un expert en lecture de factures fournisseur pour la restauration.
Extrais TOUS les articles/produits de cette facture avec leur quantité, unité, prix unitaire et prix total.
Réponds UNIQUEMENT avec un JSON valide (sans markdown, sans backticks, sans texte avant/après) dans ce format exact :
{"supplier":"nom du fournisseur","invoice_date":"YYYY-MM-DD","items":[{"product":"nom du produit","qty":nombre,"unit":"kg ou L ou unité ou g","unit_price":nombre,"total_price":nombre}]}
Règles :

async function doTesseractOCR(file){
  renderOCRZone("loading");
  try{
    let fullText="";
    if(file.type==="application/pdf"){
      const arrayBuf=await file.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:arrayBuf}).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const tc=await page.getTextContent();
        fullText+=tc.items.map(item=>item.str).join(" ")+"\n";
      }
      if(fullText.trim().length<30){
        updateOCRProgress("PDF scanné, OCR en cours...",20);
        const page=await pdf.getPage(1);
        const vp=page.getViewport({scale:2.5});
        const canvas=document.createElement("canvas");
        canvas.width=vp.width;canvas.height=vp.height;
        await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
        fullText=await runTesseract(await new Promise(r=>canvas.toBlob(r,"image/png")));
      }
    } else {
      fullText=await runTesseract(file);
    }
    ocrResults=parseInvoiceText(fullText);
    if(ocrResults.items.length>0){
      toast(`${ocrResults.items.length} articles détectés (OCR local)`,"success");
    } else {
      toast("Aucun article trouvé. Essayez avec une clé API Claude pour de meilleurs résultats.","error");
      ocrResults=null;
    }
  }catch(err){console.error(err);toast("Erreur OCR: "+err.message,"error");ocrResults=null}
}

async function runTesseract(fileOrBlob){
  updateOCRProgress("Chargement du moteur OCR...",10);
  const worker=await Tesseract.createWorker("fra",1,{
    logger:m=>{
      if(m.status==="recognizing text"){
        const pct=Math.round((m.progress||0)*100);
        updateOCRProgress(`Lecture en cours... ${pct}%`,pct);
      }
    }
  });
  const result=await worker.recognize(fileOrBlob);
  await worker.terminate();
  return result.data.text;
}

function updateOCRProgress(msg,pct){
  const z=document.getElementById("ocrZone");if(!z)return;
  z.innerHTML=`<div class="ocr-loading">

// Parser intelligent de texte de facture — v2
function parseInvoiceText(text){
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const result={supplier:"",invoice_date:"",items:[]};

  // ── Fournisseur ──
  for(const l of lines.slice(0,10)){
    if(/^[A-ZÉÈÊÀÙÎÔÛÇ\s&]{4,}$/.test(l.trim())&&!/FACTURE|TOTAL|DATE|TVA|MONTANT|QUANTITE|DESIGNATION|SIRET|SIREN|RCS|APE/.test(l)){
      result.supplier=l.trim().replace(/\s+/g," ");break;
    }
  }
  if(!result.supplier){
    for(const l of lines.slice(0,6)){
      const clean=l.replace(/[^a-zA-ZÀ-ÿ\s&]/g,"").trim();
      if(clean.length>3&&clean.length<40&&!/facture|date|page|numéro|n°|siret|tva|adresse/i.test(clean)){
        result.supplier=clean;break;
      }
    }
  }

  // ── Date ──
  for(const l of lines){
    const dm=l.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(dm){
      const y=dm[3].length===2?"20"+dm[3]:dm[3];
      const day=parseInt(dm[1]),month=parseInt(dm[2]);
      if(day>=1&&day<=31&&month>=1&&month<=12){
        result.invoice_date=`${y}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        break;
      }
    }
  }

  // ── Mots / patterns à ignorer (pas des articles) ──
  const junkLine=/siret|siren|rcs|ape|tva\s*intra|iban|bic|tel[:\s]|fax|mail|@|www\.|http|adresse|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|horaire|livraison|ouvert|fermé|total\s*(ht|ttc|général)|sous.?total|remise|escompte|acompte|règlement|échéance|paiement|facture\s*n|n[°\.]\s*facture|bon\s*de|page\s*\d|conditions|mentions|distribution|code\s*postal|cedex|téléphone|portable|mobile|comptabilité|client\s*n|commande\s*n|référence|réf[\s:]/i;
  const skipWords=/^(total|sous.?total|tva|ht|ttc|remise|net|montant|report|n\.?\s*facture|facture|date|code|réf)$/i;

  // ── Extraire les articles ──
  for(const line of lines){
    if(junkLine.test(line))continue;
    if(line.length<5)continue;

    const cleanLine=line.replace(/€/g,"").replace(/\s+/g," ");

    // Trouver tous les nombres dans la ligne
    const numbers=[];
    const numRegex=/(\d+[\.,]?\d*)/g;
    let match;
    while((match=numRegex.exec(cleanLine))!==null){
      const val=parseFloat(match[1].replace(",","."));
      numbers.push({val,idx:match.index,raw:match[1]});
    }

    if(numbers.length<2)continue;

    // Filtrer les "nombres" qui sont clairement pas des quantités/prix
    // (SIRET, téléphone, codes postaux, n° de facture, années, etc.)
    const validNumbers=numbers.filter(n=>{
      if(n.raw.length>8)return false;  // trop long = SIRET, téléphone
      if(n.val>50000)return false;     // prix > 50k€ = pas un article
      if(n.val>=2020&&n.val<=2030&&n.raw.length===4)return false; // année
      if(n.raw.length>=6&&!n.raw.includes(",")&&!n.raw.includes("."))return false; // code long sans décimale = code article/facture
      return true;
    });
    if(validNumbers.length<2)continue;

    // Extraire le nom du produit (texte avant le premier nombre valide)
    const firstNumIdx=validNumbers[0].idx;
    let productName=cleanLine.substring(0,firstNumIdx).trim();
    productName=productName.replace(/^[\d\s\-\.\#\*]+/,"").trim(); // nettoyer début
    productName=productName.replace(/[\-\.\,\;\:]+$/,"").trim();  // nettoyer fin

    if(productName.length<3)continue;
    if(skipWords.test(productName))continue;
    // Ignorer les lignes de type "lundi au jeudi de...", jours, N.FACTURE, etc.
    if(/^(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)/i.test(productName))continue;
    if(/n\.?\s*facture|facture\s*n|bon\s*de\s*commande|bon\s*de\s*livraison/i.test(productName))continue;
    // Ignorer si le nom est juste des symboles/chiffres ou trop court
    if(!/[a-zA-ZÀ-ÿ]{3,}/.test(productName))continue;

    // Interpréter les nombres
    let qty=0,unitPrice=0,totalPrice=0;

    if(validNumbers.length>=3){
      qty=validNumbers[0].val;unitPrice=validNumbers[1].val;totalPrice=validNumbers[2].val;
      // Vérifier cohérence qty * pu ≈ total
      if(qty>0&&unitPrice>0&&Math.abs(qty*unitPrice-totalPrice)<=totalPrice*0.15){
        // OK, cohérent
      } else {
        // Essayer d'autres ordres
        const combos=[[0,1,2],[0,2,1],[2,0,1]];
        let found=false;
        for(const [qi,pi,ti] of combos){
          const q=validNumbers[qi].val,p=validNumbers[pi].val,t=validNumbers[ti].val;
          if(q>0&&q<=9999&&p>0&&t>0&&Math.abs(q*p-t)<=t*0.15){
            qty=q;unitPrice=p;totalPrice=t;found=true;break;
          }
        }
        if(!found){qty=validNumbers[0].val;totalPrice=validNumbers[validNumbers.length-1].val;unitPrice=qty>0?totalPrice/qty:0}
      }
    } else {
      qty=validNumbers[0].val;totalPrice=validNumbers[1].val;
      if(qty>0)unitPrice=totalPrice/qty;
    }

    // Validation finale
    if(qty<=0||qty>9999)continue;   // quantité aberrante
    if(totalPrice<=0)continue;       // pas de prix

    // Unité
    let unit="kg";
    if(/litre|lt|\bl\b/i.test(line))unit="L";
    else if(/pièce|pce|pc|bte|boîte|boite|barq|sac|pack|lot/i.test(line))unit="unité";
    else if(/\bg\b|gramm/i.test(line))unit="g";

    result.items.push({
      product:productName.charAt(0).toUpperCase()+productName.slice(1),
      qty:Math.round(qty*100)/100,
      unit,
      unit_price:Math.round(unitPrice*100)/100,
      total_price:Math.round(totalPrice*100)/100
    });
  }

  return result;
}

// ── Fuzzy matching ingrédient ──
function fuzzyMatchIng(productName){
  const pLow=(productName||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  let bestIng=null,bestScore=0;
  for(const ing of db.ingredients){
    const iLow=ing.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    // Exact contain
    if(pLow.includes(iLow)||iLow.includes(pLow)){return ing}
    // Word overlap
    const pWords=pLow.split(/\s+/);const iWords=iLow.split(/\s+/);
    let score=0;
    for(const pw of pWords){for(const iw of iWords){
      if(pw.length>=3&&iw.length>=3){
        if(pw===iw)score+=3;
        else if(pw.includes(iw)||iw.includes(pw))score+=2;
        else if(levenshtein(pw,iw)<=2)score+=1;
      }
    }}
    if(score>bestScore){bestScore=score;bestIng=ing}
  }
  return bestScore>=2?bestIng:null;
}
function levenshtein(a,b){
  const m=[];for(let i=0;i<=b.length;i++){m[i]=[i];for(let j=1;j<=a.length;j++){m[i][j]=i===0?j:Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[j-1]===b[i-1]?0:1))}}
  return m[b.length][a.length];
}

function importOCR(){
  if(!ocrResults?.items)return;
  // Lire les valeurs éditées depuis le DOM
  const supplier=document.getElementById("ocrSupplier")?.value||ocrResults.supplier||"OCR";
  const invDate=document.getElementById("ocrDate")?.value||ocrResults.invoice_date||today();

  const imp=[];
  ocrResults.items.forEach((it,i)=>{
    const matchSel=document.getElementById("ocrM"+i);
    const ingId=matchSel?.value;
    if(!ingId)return; // pas matché = on skip

    const qty=parseFloat(document.getElementById("ocrQ"+i)?.value)||it.qty||0;
    const totalPrice=parseFloat(document.getElementById("ocrT"+i)?.value)||it.total_price||0;
    const unitPrice=qty>0?totalPrice/qty:0;

    if(qty>0&&totalPrice>0){
      imp.push({id:uid(),date:invDate,ingredientId:ingId,qty,totalPrice,unitPrice,supplier});
    }
  });

  if(!imp.length){toast("Sélectionnez un ingrédient dans la colonne 'Match' pour au moins un article","error");return}
  db.purchases.push(...imp);ocrResults=null;saveDB();renderPurchases();toast(`${imp.length} achats importés depuis la facture`,"success");
}

const CATALOG_CATS = ["Ingrédient pizza","Emballage","Boisson","Produit ménager","Autre"];

function getCatalogPrice(prod) {
  if (!prod.priceHistory || !prod.priceHistory.length) return null;
  return prod.priceHistory.sort((a,b)=>b.date.localeCompare(a.date))[0].price;
}

function saveCatalogProduct(existingId) {
  const name  = document.getElementById('catName').value.trim();
  const price = parseFloat(document.getElementById('catPrice').value);
  if (!name) { toast('Nom requis','error'); return; }
  const newProd = {
    id:         existingId || uid(),
    name,
    supplierRef:document.getElementById('catRef').value.trim(),
    category:   document.getElementById('catCat').value,
    supplier:   document.getElementById('catSup').value,
    unit:       document.getElementById('catUnit').value,
    linkedIngredientId: document.getElementById('catIngLink').value,
    priceHistory: []
  };
  if (existingId) {
    const idx = db.catalog.findIndex(p=>p.id===existingId);
    if (idx >= 0) {
      newProd.priceHistory = db.catalog[idx].priceHistory || [];
    }
  }
  if (price) {
    const existing = newProd.priceHistory.find(p=>p.date===today());
    if (!existing) newProd.priceHistory.push({date:today(), price, supplier:newProd.supplier});
  }
  if (existingId) {
    const idx = db.catalog.findIndex(p=>p.id===existingId);
    if (idx>=0) db.catalog[idx]=newProd;
  } else {
    db.catalog.push(newProd);
  }
  // Sync vers ingredient si lié
  syncCatalogToIngredient(newProd);
  saveDB(); closeModal(); renderTariffs();
  toast(existingId?'Produit modifié':'Produit ajouté','success');
}

function editCatalogProduct(id) {
  const prod = db.catalog.find(p=>p.id===id);
  if (prod) openCatalogModal(prod);
}

function deleteCatalogProduct(id) {
  if (!confirm('Supprimer ce produit du catalogue ?')) return;
  db.catalog = db.catalog.filter(p=>p.id!==id);
  saveDB(); renderTariffs();
}

function linkCatalogToIngredient(prodId, ingId) {
  const prod = db.catalog.find(p=>p.id===prodId);
  if (!prod) return;
  prod.linkedIngredientId = ingId;
  syncCatalogToIngredient(prod);
  saveDB();
  toast(ingId ? '🔗 Produit lié à l\'ingrédient' : 'Lien supprimé', 'success');
}

// Propagation : met à jour l'historique des prix de l'ingrédient lié
function syncCatalogToIngredient(prod) {
  if (!prod.linkedIngredientId) return;
  const ing = db.ingredients.find(i=>i.id===prod.linkedIngredientId);
  if (!ing) return;
  if (!ing.priceHistory) ing.priceHistory = [];
  const price = getCatalogPrice(prod);
  if (!price) return;
  const dateKey = (prod.priceHistory||[]).sort((a,b)=>b.date.localeCompare(a.date))[0]?.date || today();
  const exists = ing.priceHistory.find(p=>p.date===dateKey && Math.abs(p.price-price)<0.01);
  if (!exists) {
    ing.priceHistory.push({date:dateKey, price, unit:prod.unit||'kg', supplier:prod.supplier||''});
    ing.priceHistory.sort((a,b)=>b.date.localeCompare(a.date));
  }
}

function exportCatalogCSV() {
  const rows = [['Nom','Ref fournisseur','Catégorie','Fournisseur','Prix actuel','Unité','Ingrédient lié']];
  db.catalog.forEach(p => {
    const price = getCatalogPrice(p);
    const ing   = p.linkedIngredientId ? db.ingredients.find(i=>i.id===p.linkedIngredientId)?.name||'' : '';
    rows.push([p.name, p.supplierRef||'', p.category||'', p.supplier||'', price||'', p.unit||'', ing]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const b = new Blob(['\uFEFF'+csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=`catalogue_produits_${today()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Correspondance catalogue pour l'import Drive ─────────────────────────
function findOrCreateCatalogProduct(productName, supplier, unit, price, date) {
  const pnorm = productName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  // 1. Chercher dans le catalogue existant
  let prod = db.catalog.find(p => {
    const n = p.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return n === pnorm || (supplier && p.supplier===supplier && n.includes(pnorm.split(' ')[0]));
  });
  // 2. Sinon créer
  if (!prod) {
    // Deviner la catégorie
    const pn = pnorm;
    let category = 'Autre';
    const ingKw = ['tomate','mozza','fromage','jambon','bacon','poulet','marlin','saumon','crevette','lardon','merguez','oignon','olive','basilic','pate','farine','creme','champignon','ananas','poivron','aubergine'];
    const embKw = ['boite','sac','emball','sachet','film','papier','pot','barquette'];
    const menaKw = ['deterg','liquid','vaisselle','sanitol','creoline','sol','poubelle'];
    const boissKw = ['biere','eau','jus','cola','soda','limonade','tropico','corona','despera'];
    if (ingKw.some(k=>pn.includes(k)))  category='Ingrédient pizza';
    else if (embKw.some(k=>pn.includes(k)))  category='Emballage';
    else if (menaKw.some(k=>pn.includes(k))) category='Produit ménager';
    else if (boissKw.some(k=>pn.includes(k)))category='Boisson';

    prod = {
      id: uid(),
      name: productName,
      supplierRef: '',
      category,
      supplier: supplier||'',
      unit: unit||'kg',
      linkedIngredientId: matchIngredient(productName)?.id || '',
      priceHistory: []
    };
    db.catalog.push(prod);
  }
  // 3. Mettre à jour le prix si nouveau
  if (price) {
    const dateKey = date || today();
    const exists = prod.priceHistory.find(p=>p.date===dateKey && Math.abs(p.price-price)<0.01);
    if (!exists) prod.priceHistory.push({date:dateKey, price, supplier:supplier||prod.supplier});
    if (!prod.supplier && supplier) prod.supplier = supplier;
    if (!prod.unit && unit) prod.unit = unit;
  }
  // 4. Propagation vers ingrédient lié
  syncCatalogToIngredient(prod);
  return prod;
}

/* ══════════════════════════════════════════════
   INVENTAIRE — Lecture auto Firebase RTDB
   Chemin : inventaires_pizzapp/{date}/{ingredientId} → realQty
   ══════════════════════════════════════════════ */
let invRtdbListener=null, invRtdbData={}, invRtdbStatus='idle';

function startInventoryListener(){
  const r=initRTDB();if(!r||invRtdbListener)return;
  invRtdbStatus='loading';
  try{
    invRtdbListener=r.ref('inventaires_pizzapp').on('value',snap=>{
      const raw=snap.val()||{};
      invRtdbData={};
      Object.entries(raw).forEach(([date,ings])=>{
        invRtdbData[date]={};
        Object.entries(ings||{}).forEach(([ingId,val])=>{
          invRtdbData[date][ingId]=typeof val==='object'?(val.realQty??0):Number(val);
        });
      });
      invRtdbStatus='ok';
      mergeRtdbIntoInventories();
      if(currentPage==='inventory')renderInventory();
    },err=>{console.warn('RTDB inv:',err);invRtdbStatus='error';});
  }catch(e){invRtdbStatus='error';}
}

function mergeRtdbIntoInventories(){
  Object.entries(invRtdbData).forEach(([date,ings])=>{
    Object.entries(ings).forEach(([ingId,realQty])=>{
      const exists=db.inventories.find(i=>i.date===date&&i.ingredientId===ingId);
      if(!exists&&realQty>0)db.inventories.push({id:uid(),date,ingredientId:ingId,realQty,_fromRtdb:true});
      else if(exists&&exists._fromRtdb)exists.realQty=realQty;
    });
  });
}

function getRtdbInventoryForDate(date){return invRtdbData[date]||{};}

function syncInventoryFromRtdb(){
  const r=initRTDB();if(!r){toast('Firebase non connecté','error');return;}
  toast('🔄 Lecture Firebase...','info');
  r.ref('inventaires_pizzapp').once('value',snap=>{
    const raw=snap.val()||{};
    invRtdbData={};
    Object.entries(raw).forEach(([date,ings])=>{
      invRtdbData[date]={};
      Object.entries(ings||{}).forEach(([ingId,val])=>{
        invRtdbData[date][ingId]=typeof val==='object'?(val.realQty??0):Number(val);
      });
    });
    invRtdbStatus='ok';
    mergeRtdbIntoInventories();
    renderInventory();
    toast(`✅ ${Object.keys(invRtdbData).length} date(s) chargée(s) depuis Firebase`,'success');
  },err=>{toast('Erreur Firebase: '+err.message,'error');});
}

function renderInventory(){
  if(invRtdbStatus==='idle')startInventoryListener();
  const allDates=[...new Set([...db.inventories.map(i=>i.date),...Object.keys(invRtdbData)])].sort().reverse();
  const vd=document.getElementById('invDateSel')?.value||allDates[0]||'';
  // PIVOT : consommations ET achats depuis la date d'inventaire seulement
  const pivotSales = vd ? db.sales.filter(s=>s.date>=vd) : db.sales;
  const cons=getConsumption(pivotSales); // inclut pâte maison
  let analysisHTML='',totalVal=0;

  if(vd){
    const rtdbForDate=getRtdbInventoryForDate(vd);
    const invF=db.inventories.filter(i=>i.date===vd);
    const qtyMap={};
    invF.forEach(inv=>{qtyMap[inv.ingredientId]=inv.realQty;});
    Object.entries(rtdbForDate).forEach(([ingId,qty])=>{qtyMap[ingId]=qty;});

    const rtdbCount=Object.keys(rtdbForDate).length;
    const statusBadge=invRtdbStatus==='ok'
      ?`<span style="background:rgba(34,197,94,.15);color:#16a34a;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600">🔥 ${rtdbCount} lignes Firebase</span>`
      :invRtdbStatus==='loading'
      ?`<span style="font-size:11px;color:var(--tx3)">⏳ Connexion…</span>`
      :`<span style="font-size:11px;color:var(--tx3)">📱 Local</span>`;

    const analysis=db.ingredients.map(ing=>{
      const rq=qtyMap[ing.id];if(rq===undefined)return null;
      // Achats reçus APRÈS cet inventaire
      const achatsPost=db.purchases.filter(p=>p.ingredientId===ing.id&&p.date>vd).reduce((s,p)=>s+p.qty,0);
      // Consommations depuis cet inventaire (déjà filtrées via pivotSales)
      const tc=cons[ing.id]||0;
      // Stock théorique = inventaire de départ + entrées - sorties
      const st=Math.max(0, rq + achatsPost - tc);
      const ec=Math.round((st-rq)*100)/100; // ≈ achatsPost - tc
      const lp=tc>0&&(rq+achatsPost)>0?(tc/(rq+achatsPost))*100:0;
      const cmp=getCMP(ing.id);const val=rq*cmp;
      totalVal+=val;
      const fromRtdb=rtdbForDate[ing.id]!==undefined;
      return{name:ing.name,unit:ing.unit,cat:ing.category,rq,st:Math.round(st*100)/100,ec,lp:Math.round(lp*10)/10,val:Math.round(val*100)/100,fromRtdb};
    }).filter(Boolean);

    analysisHTML=`
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap">
        <div class="field"><label>Date inventaire</label>
          <select id="invDateSel" onchange="renderInventory()">
            ${allDates.map(d=>`<option value="${d}"${d===vd?' selected':''}>${dDate(d)}${invRtdbData[d]?' 🔥':''}</option>`).join('')}
          </select>
        </div>
        ${statusBadge}
        <div class="stat-card" style="min-width:auto;padding:14px 20px">
          <div class="stat-val" style="font-size:20px">${fmt(totalVal)}</div>
          <div class="stat-label">Valorisation stock</div>
        </div>
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr>
          <th>Produit</th><th>Cat.</th>
          <th class="text-right">Réel</th><th class="text-right">Théo.</th>
          <th class="text-right">Écart</th><th class="text-right">Perte %</th>
          <th class="text-right">Valeur</th>
        </tr></thead><tbody>
         ${analysis.map(r=>{
           const ing = db.ingredients.find(i=>i.name===r.name);
           const invFactor = ing?.invFactor || 1;
           const invUnit   = ing?.invUnit   || r.unit;
           const toHuman   = v => invFactor>1 ? fN(v/invFactor,2)+' '+invUnit : fN(v)+' '+r.unit;
           return`<tr>
           <td class="fw600">${r.name}${r.fromRtdb?'<span style="margin-left:4px;font-size:10px;color:#22c55e">🔥</span>':''}</td>
           <td><span class="badge badge-cat">${r.cat}</span></td>
           <td class="text-right"><b>${toHuman(r.rq)}</b></td>
           <td class="text-right">${toHuman(r.st)}</td>
           <td class="text-right fw700" style="color:${Math.abs(r.ec)<.1?'var(--tx2)':r.ec>0?'var(--yellow)':'var(--red)'}">${r.ec>0?'+':''}${toHuman(Math.abs(r.ec))}</td>
           <td class="text-right fw700" style="color:${Math.abs(r.lp)<2?'var(--green)':r.lp>5?'var(--red)':'var(--yellow)'}">${fN(r.lp,1)}%</td>
           <td class="text-right fw700 clr-accent">${fmt(r.val)}</td>
         </tr>`;}).join('')}
        ${analysis.length===0?`<tr><td colspan="7" class="empty-row">Aucune donnée pour cette date</td></tr>`:''}
        </tbody></table></div>`;
  }

  const el=document.getElementById('page-inventory');
  el.innerHTML=`
    <div class="top-bar"><h1 class="page-title">Inventaire & Stock</h1>
      <div style="display:flex;gap:7px">
        <button class="btn btn-secondary" onclick="syncInventoryFromRtdb()" title="Recharger depuis Firebase">🔄 Sync</button>
        <button class="btn btn-primary" onclick="openInventoryModal()">✅ Saisie manuelle</button>
      </div>
    </div>
    <div style="background:${invRtdbStatus==='ok'?'rgba(34,197,94,.08)':'rgba(245,158,11,.08)'};border:1px solid ${invRtdbStatus==='ok'?'rgba(34,197,94,.25)':'rgba(245,158,11,.25)'};border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px">

// Publier l'inventaire sur Firebase RTDB (en grammes pour la cohérence interne)
function pushInventoryToRTDB(date, items){
  try {
    const r = initRTDB();
    if(!r) return;
    const payload = {};
    items.forEach(it => { payload[it.ingredientId] = it.realQty; }); // stocké en g
    r.ref('inventaires_pizzapp/' + date).update(payload)
     .then(()=>console.log('🔥 Inventaire publié sur Firebase:', date))
     .catch(e=>console.warn('Inventaire RTDB:', e.message));
  } catch(e) {}
}

function saveInventory(){
  const date=document.getElementById('invDate').value;
  const items=db.ingredients.map((ing,idx)=>{
    const v=document.getElementById('invQ'+idx)?.value;
    if(!v||v==='')return null;
    const invFactor = ing.invFactor || 1;
    // Convertir l'unité de saisie en grammes/ml pour le stockage
    const realQty = parseFloat(v) * invFactor;
    return{id:uid(),date,ingredientId:ing.id,realQty,invQty:parseFloat(v),invUnit:ing.invUnit||ing.unit};
  }).filter(Boolean);
  if(!items.length){toast('Saisissez au moins une quantité','error');return;}
  db.inventories=db.inventories.filter(i=>!(i.date===date&&!i._fromRtdb));
  db.inventories.push(...items);
  saveDB();
  // Publier sur Firebase RTDB en grammes (pour cohérence)
  pushInventoryToRTDB(date, items);
  closeModal();renderInventory();
  toast(`✅ ${items.length} produits enregistrés`,'success');
}

/* ── Meilleur fournisseur par ingrédient ─────────────────────────────
   Cherche dans les achats ET le catalogue, retourne
   { supplier, price, unit } du fournisseur au dernier prix le plus bas
   ─────────────────────────────────────────────────────────────────── */
function getBestSupplier(ingId) {
  const prices = []; // [{supplier, price, date}]

  // 1. Depuis les achats — dernier prix par fournisseur
  const pursBySupplier = {};
  db.purchases.filter(p => p.ingredientId === ingId && p.supplier && p.unitPrice > 0)
    .forEach(p => {
      if (!pursBySupplier[p.supplier] || p.date > pursBySupplier[p.supplier].date) {
        pursBySupplier[p.supplier] = p;
      }
    });
  Object.values(pursBySupplier).forEach(p =>
    prices.push({ supplier: p.supplier, price: p.unitPrice, date: p.date, source: 'achat' })
  );

  // 2. Depuis le catalogue — dernier prix par fournisseur
  (db.catalog||[]).filter(c => c.linkedIngredientId === ingId).forEach(prod => {
    const hist = (prod.priceHistory||[]).sort((a,b) => b.date.localeCompare(a.date));
    if (hist.length && prod.supplier) {
      const last = hist[0];
      // Vérifier qu'on n'a pas déjà ce fournisseur depuis les achats (plus récent)
      const existing = prices.find(p => p.supplier === prod.supplier);
      if (!existing || last.date > existing.date) {
        const idx = prices.findIndex(p => p.supplier === prod.supplier);
        const entry = { supplier: prod.supplier, price: last.price, date: last.date, source: 'catalogue', unit: prod.unit };
        if (idx >= 0) prices[idx] = entry;
        else prices.push(entry);
      }
    }
  });

  if (!prices.length) return null;
  // Trier par prix croissant → meilleur = le plus bas
  prices.sort((a,b) => a.price - b.price);
  return prices[0]; // {supplier, price, date, source}
}

/* ── Tous les prix par fournisseur pour un ingrédient ─────────────── */
function getAllSupplierPrices(ingId) {
  const map = {};
  db.purchases.filter(p => p.ingredientId === ingId && p.supplier && p.unitPrice > 0)
    .forEach(p => {
      if (!map[p.supplier] || p.date > map[p.supplier].date)
        map[p.supplier] = { supplier: p.supplier, price: p.unitPrice, date: p.date };
    });
  (db.catalog||[]).filter(c => c.linkedIngredientId === ingId).forEach(prod => {
    const hist = (prod.priceHistory||[]).sort((a,b)=>b.date.localeCompare(a.date));
    if (hist.length && prod.supplier) {
      const last = hist[0];
      if (!map[prod.supplier] || last.date > map[prod.supplier].date)
        map[prod.supplier] = { supplier: prod.supplier, price: last.price, date: last.date };
    }
  });
  return Object.values(map).sort((a,b) => a.price - b.price);
}
