:root{
  --bg:#0a0a0a;--card:#151515;--card2:#1c1c1c;--border:#2a2a2a;
  --tx:#f0ece6;--tx2:#9c8e80;--tx3:#5a5048;
  --accent:#e76f51;--accent-lt:rgba(231,111,81,.15);
  --green:#16a34a;--green-lt:rgba(22,163,74,.15);
  --yellow:#f59e0b;--yellow-lt:rgba(245,158,11,.15);
  --blue:#3b82f6;--blue-lt:rgba(59,130,246,.15);
  --red:#ef4444;--purple:#8b5cf6;
  --congel:#38bdf8;--congel-lt:rgba(56,189,248,.12);
  --frigo:#34d399;--frigo-lt:rgba(52,211,153,.12);
  --sec:#fbbf24;--sec-lt:rgba(251,191,36,.12);
  --boisson:#a78bfa;--boisson-lt:rgba(167,139,250,.12);
  --hygiene:#f472b6;--hygiene-lt:rgba(244,114,182,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}

/* ── Splash ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:120px;margin-bottom:20px;filter:drop-shadow(0 0 30px rgba(231,111,81,.3))}
#splash h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
#splash h1 span{color:var(--accent)}
#splash p{color:var(--tx2);font-size:13px;margin-top:6px}

/* ── Name input ── */
#nameScreen{display:none;padding:40px 20px;text-align:center}
#nameScreen h2{font-size:20px;font-weight:700;margin-bottom:6px}
#nameScreen p{color:var(--tx2);font-size:13px;margin-bottom:24px}
#nameInput{width:100%;max-width:320px;padding:14px 18px;border-radius:14px;border:2px solid var(--border);background:var(--card);color:var(--tx);font-size:16px;font-family:inherit;text-align:center;outline:none;transition:border .2s}
#nameInput:focus{border-color:var(--accent)}
#startBtn{margin-top:18px;padding:14px 40px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:700;font-family:inherit;opacity:.4;pointer-events:none;transition:all .25s}
#startBtn.ready{opacity:1;pointer-events:auto}

/* ── Header ── */
#header{position:sticky;top:0;z-index:50;background:var(--bg);padding:12px 16px 0;border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.header-top h2{font-size:16px;font-weight:700}
.header-top span{font-size:12px;color:var(--tx2)}
.progress-wrap{background:var(--card);border-radius:10px;height:8px;overflow:hidden;margin-bottom:10px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),#f97316);border-radius:10px;transition:width .4s ease;width:0}
.progress-text{font-size:11px;color:var(--tx2);margin-bottom:8px;display:flex;justify-content:space-between}

/* ── Zone tabs ── */
.zone-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.zone-tabs::-webkit-scrollbar{display:none}
.zone-tab{flex-shrink:0;padding:7px 14px;border-radius:10px;font-size:12px;font-weight:600;border:none;background:var(--card);color:var(--tx2);transition:all .2s;white-space:nowrap;position:relative}
.zone-tab.active{color:#fff}
.zone-tab[data-zone="CONGEL"].active{background:var(--congel);color:#000}
.zone-tab[data-zone="FRIGO"].active{background:var(--frigo);color:#000}
.zone-tab[data-zone="SEC"].active{background:var(--sec);color:#000}
.zone-tab[data-zone="BOISSONS"].active{background:var(--boisson);color:#000}
.zone-tab[data-zone="HYGIENE"].active{background:var(--hygiene);color:#000}
.zone-tab[data-zone="ALL"].active{background:var(--accent)}
.zone-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;background:var(--green);color:#fff}

/* ── Items list ── */
#itemsList{padding:12px 16px 120px}
.zone-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--tx3);margin:18px 0 10px;padding-left:4px}
.zone-header:first-child{margin-top:6px}

.item-card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;border:2px solid transparent;transition:all .25s}
.item-card.counted{border-color:var(--green);background:var(--green-lt)}
.item-card.zero{border-color:var(--red);background:rgba(239,68,68,.08)}
.item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.item-name{font-size:14px;font-weight:600;flex:1}
.item-info{display:flex;gap:6px;align-items:center}
.item-tag{font-size:9px;font-weight:700;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
.tag-congel{background:var(--congel-lt);color:var(--congel)}
.tag-frigo{background:var(--frigo-lt);color:var(--frigo)}
.tag-sec{background:var(--sec-lt);color:var(--sec)}
.tag-boisson{background:var(--boisson-lt);color:var(--boisson)}
.tag-hygiene{background:var(--hygiene-lt);color:var(--hygiene)}
.item-stock{font-size:10px;color:var(--tx3)}
.item-stock b{color:var(--tx2)}

.input-row{display:flex;align-items:center;gap:10px}
.qty-btn{width:44px;height:44px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--tx);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.qty-btn:active{transform:scale(.92);background:var(--accent);border-color:var(--accent);color:#fff}
.qty-input{flex:1;height:44px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--tx);font-size:18px;font-weight:700;text-align:center;font-family:inherit;outline:none;transition:border .2s;-moz-appearance:textfield}
.qty-input::-webkit-inner-spin-button,.qty-input::-webkit-outer-spin-button{-webkit-appearance:none}
.qty-input:focus{border-color:var(--accent)}
.item-unit{font-size:12px;color:var(--tx2);font-weight:600;min-width:30px}
.check-done{width:28px;height:28px;border-radius:8px;background:var(--green);color:#fff;font-size:14px;display:none;align-items:center;justify-content:center;flex-shrink:0}
.item-card.counted .check-done,.item-card.zero .check-done{display:flex}

/* ── Submit bar ── */
#submitBar{position:fixed;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top,var(--bg) 80%,transparent);z-index:40;display:none}
#submitBtn{width:100%;padding:16px;border-radius:16px;border:none;background:var(--accent);color:#fff;font-size:17px;font-weight:700;font-family:inherit;opacity:.4;pointer-events:none;transition:all .3s}
#submitBtn.ready{opacity:1;pointer-events:auto;animation:pulse-btn 2s infinite}
@keyframes pulse-btn{0%,100%{box-shadow:0 0 0 0 rgba(231,111,81,.4)}50%{box-shadow:0 0 0 12px rgba(231,111,81,0)}}

/* ── Success overlay ── */
#successOverlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#successOverlay.show{display:flex}
.success-icon{font-size:80px;margin-bottom:20px;animation:bounce-in .6s cubic-bezier(.36,1.5,.5,1)}
@keyframes bounce-in{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.success-title{font-size:24px;font-weight:800;margin-bottom:8px}
.success-sub{color:var(--tx2);font-size:14px;margin-bottom:30px;max-width:300px;line-height:1.5}
.success-stats{display:flex;gap:16px;margin-bottom:30px}
.success-stat{background:var(--card);border-radius:14px;padding:16px 22px;text-align:center}
.success-stat .val{font-size:28px;font-weight:800;color:var(--accent)}
.success-stat .lbl{font-size:11px;color:var(--tx2);margin-top:2px}

/* ── Confetti ── */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti{position:absolute;width:10px;height:10px;top:-10px;animation:confetti-fall 3s ease-in forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* ── Search ── */
#searchWrap{padding:0 16px;margin-bottom:4px}
#searchInput{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--tx);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
#searchInput:focus{border-color:var(--accent)}
#searchWrap{position:relative}
#searchWrap::before{content:"🔍";position:absolute;left:30px;top:50%;transform:translateY(-50%);font-size:14px}

/* ── Shop selector ── */
.shop-selector{display:flex;gap:8px;margin:16px 16px 0}
.shop-btn{flex:1;padding:12px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--tx2);font-size:13px;font-weight:600;text-align:center;transition:all .2s}
.shop-btn.active{border-color:var(--accent);background:var(--accent-lt);color:var(--accent)}
</style>
</head>

    <button class="shop-btn" data-shop="centreville" onclick="selectShop(this)">📍 Centre-Ville</button>
  </div>
  <br>
  <button id="startBtn" onclick="startInventory()">C'est parti ! 🍕</button>
</div>

<!-- MAIN -->

  <div id="header">
    <div class="header-top">

      <span id="headerShop"></span>
    </div>

    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="zone-tabs" id="zoneTabs"></div>
  </div>

  <div id="searchWrap">
    <input type="text" id="searchInput" placeholder="Rechercher un produit..." oninput="filterItems()">
  </div>

  <div id="itemsList"></div>

  <div id="submitBar">
    <button id="submitBtn" onclick="submitInventory()">📤 Envoyer l'inventaire</button>
  </div>
</div>

<!-- SUCCESS -->
<div id="successOverlay">

  <div class="success-title" id="successTitle">Bravo !</div>
  <div class="success-sub" id="successSub">Inventaire envoyé avec succès</div>
  <div class="success-stats" id="successStats"></div>
</div>
<div class="confetti-container" id="confettiContainer"></div>

// ══════════════════════════════════════════
// SYNC DEPUIS PIZZAPP (Firebase RTDB)
// Lit shop_config/pizzapp_recipes/ingredients
// Met à jour stocks mini + conditionnements
// ══════════════════════════════════════════
let firebaseSynced = false;

function syncFromPizzApp() {
  rtdb.ref("shop_config/pizzapp_recipes/ingredients").once("value", function(snap) {
    const data = snap.val();
    if (!data || !Array.isArray(data)) { console.log("Pas de données PizzApp"); return; }

    data.forEach(function(ing) {
      if (!ing || !ing.id) return;
      const local = ALL_PRODUCTS.find(function(p) { return p.pizzappId === ing.id; });
      if (local) {
        if (ing.condUnit) local.unit = ing.condUnit;
        if (ing.condMini > 0) local.stockMini = ing.condMini;
        if (ing.condFournisseur) local.fournisseur = ing.condFournisseur;
        if (ing.condZone) local.zone = ing.condZone;
        if (ing.condQty > 0) local.condQty = ing.condQty;
        local.recipeUnit = ing.unit || "g";
        local.minStockRecipe = ing.minStock || 0;
      }
    });

    firebaseSynced = true;
    console.log("✅ Sync PizzApp OK — " + data.length + " ingrédients");

    if (document.getElementById("mainApp").style.display !== "none") {
      renderZoneTabs();
      renderItems();
      updateProgress();
    }
  }, function(err) {
    console.warn("Sync PizzApp erreur:", err.message);
  });
}

firebase.auth().onAuthStateChanged(function(user) {
  if (user) syncFromPizzApp();
});

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let personName = "";
let selectedShop = "";
let quantities = {};  // {productId: number}
let activeZone = "ALL";
const ZONES = ["ALL","CONGEL","FRIGO","SEC","BOISSONS","HYGIENE"];
const ZONE_EMOJI = {CONGEL:"❄️",FRIGO:"🧊",SEC:"📦",BOISSONS:"🥤",HYGIENE:"🧹",ALL:"📋"};
const ZONE_COLORS = {CONGEL:"var(--congel)",FRIGO:"var(--frigo)",SEC:"var(--sec)",BOISSONS:"var(--boisson)",HYGIENE:"var(--hygiene)"};

// ══════════════════════════════════════════
// SPLASH → NAME
// ══════════════════════════════════════════
// Restauration automatique si session en cours
setTimeout(() => {
  document.getElementById("splash").classList.add("hide");
  if (restoreSession()) {
    // Session trouvée → reprendre directement
    document.getElementById("nameScreen").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
    document.getElementById("submitBar").style.display = "block";
    document.getElementById("headerName").textContent = personName;
    document.getElementById("headerShop").textContent = selectedShop === "valmeniere" ? "📍 Valmenière" : "📍 Centre-Ville";
    renderZoneTabs();
    renderItems();
    updateProgress();
  } else {
    document.getElementById("nameScreen").style.display = "block";
  }
}, 1800);

// Empêcher la fermeture/rafraîchissement accidentel
window.addEventListener("beforeunload", function(e) {
  if (getCounted() > 0) {
    e.preventDefault();
    e.returnValue = "";
  }
});

document.getElementById("nameInput").addEventListener("input", function() {
  checkReady();
});

function selectShop(btn) {
  document.querySelectorAll(".shop-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  selectedShop = btn.dataset.shop;
  checkReady();
}

function checkReady() {
  const name = document.getElementById("nameInput").value.trim();
  const btn = document.getElementById("startBtn");
  if (name.length >= 2 && selectedShop) {
    btn.classList.add("ready");
  } else {
    btn.classList.remove("ready");
  }
}

function startInventory() {
  personName = document.getElementById("nameInput").value.trim();
  if (!personName || !selectedShop) return;

  document.getElementById("nameScreen").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("submitBar").style.display = "block";
  document.getElementById("headerName").textContent = personName;
  document.getElementById("headerShop").textContent = selectedShop === "valmeniere" ? "📍 Valmenière" : "📍 Centre-Ville";

  renderZoneTabs();
  renderItems();
  updateProgress();
}

// ══════════════════════════════════════════
// ZONE TABS
// ══════════════════════════════════════════
function renderZoneTabs() {
  const el = document.getElementById("zoneTabs");
  el.innerHTML = ZONES.map(z => {
    const count = z === "ALL" ? getCounted() : getCounted(z);
    const total = z === "ALL" ? ALL_PRODUCTS.length : ALL_PRODUCTS.filter(p => p.zone === z).length;
    return `<button class="zone-tab ${z===activeZone?'active':''}" data-zone="${z}" onclick="setZone('${z}')">
      ${ZONE_EMOJI[z]||""} ${z==="ALL"?"Tout":z}
      ${count>0?`<span class="zone-badge">${count}</span>`:""}
    </button>`;
  }).join("");
}

function setZone(z) {
  activeZone = z;
  renderZoneTabs();
  renderItems();
}

function getCounted(zone) {
  return ALL_PRODUCTS.filter(p => {
    if (zone && p.zone !== zone) return false;
    return quantities[p.id] !== undefined;
  }).length;
}

// ══════════════════════════════════════════
// RENDER ITEMS
// ══════════════════════════════════════════
function renderItems() {
  const el = document.getElementById("itemsList");
  const search = (document.getElementById("searchInput")?.value || "").toLowerCase();
  let items = ALL_PRODUCTS;

  if (activeZone !== "ALL") items = items.filter(p => p.zone === activeZone);
  if (search) items = items.filter(p => p.name.toLowerCase().includes(search));

  // Group by zone
  const groups = {};
  items.forEach(p => {
    if (!groups[p.zone]) groups[p.zone] = [];
    groups[p.zone].push(p);
  });

  let html = "";
  const zoneOrder = ["CONGEL","FRIGO","SEC","BOISSONS","HYGIENE"];
  for (const z of zoneOrder) {
    if (!groups[z]) continue;
    if (activeZone === "ALL") {
      html += `<div class="zone-header">${ZONE_EMOJI[z]} ${z} (${groups[z].length})</div>`;
    }
    groups[z].forEach(p => {
      const val = quantities[p.id];
      const isCounted = val !== undefined;
      const isZero = isCounted && val === 0;
      const cls = isZero ? "zero" : isCounted ? "counted" : "";
      const tagCls = "tag-" + p.zone.toLowerCase();

      html += `<div class="item-card ${cls}" id="card-${p.id}">
        <div class="item-top">
          <div class="item-name">${p.name}</div>
          <div class="item-info">
            <span class="item-tag ${tagCls}">${p.zone}</span>
            <div class="item-stock">mini: <b>${p.stockMini}</b> ${p.unit}</div>
          </div>
        </div>
        <div class="input-row">
          <button class="qty-btn" onclick="adjust('${p.id}',-1)" aria-label="Moins">−</button>
          <input class="qty-input" type="number" inputmode="numeric" step="1" min="0"
            id="input-${p.id}" value="${isCounted ? val : ''}"
            placeholder="—"
            oninput="setQty('${p.id}',this.value)"
            onfocus="this.select()">
          <span class="item-unit">${p.unit}</span>
          <button class="qty-btn" onclick="adjust('${p.id}',1)" aria-label="Plus">+</button>
          <div class="check-done">${isZero ? '⚠️' : '✓'}</div>
        </div>
      </div>`;
    });
  }

  if (!html) html = '<div style="text-align:center;padding:60px 20px;color:var(--tx3)"><div style="font-size:40px;margin-bottom:12px">🔍</div>Aucun produit trouvé</div>';
  el.innerHTML = html;
}

function filterItems() { renderItems(); }

// ══════════════════════════════════════════
// QUANTITIES
// ══════════════════════════════════════════
function saveSession() {
  try {
    sessionStorage.setItem("mwaka-inv-qty", JSON.stringify(quantities));
    sessionStorage.setItem("mwaka-inv-name", personName);
    sessionStorage.setItem("mwaka-inv-shop", selectedShop);
    sessionStorage.setItem("mwaka-inv-zone", activeZone);
  } catch(e) {}
}

function restoreSession() {
  try {
    const saved = sessionStorage.getItem("mwaka-inv-qty");
    const name = sessionStorage.getItem("mwaka-inv-name");
    const shop = sessionStorage.getItem("mwaka-inv-shop");
    const zone = sessionStorage.getItem("mwaka-inv-zone");
    if (saved && name) {
      quantities = JSON.parse(saved);
      personName = name;
      selectedShop = shop || "";
      activeZone = zone || "ALL";
      return true;
    }
  } catch(e) {}
  return false;
}

function clearSession() {
  sessionStorage.removeItem("mwaka-inv-qty");
  sessionStorage.removeItem("mwaka-inv-name");
  sessionStorage.removeItem("mwaka-inv-shop");
  sessionStorage.removeItem("mwaka-inv-zone");
}

function setQty(id, val) {
  if (val === "" || val === undefined) {
    delete quantities[id];
  } else {
    quantities[id] = Math.max(0, parseFloat(val) || 0);
  }
  updateCard(id);
  updateProgress();
  saveSession();
}

function adjust(id, delta) {
  const current = quantities[id] !== undefined ? quantities[id] : 0;
  const next = Math.max(0, current + delta);
  quantities[id] = next;
  const inp = document.getElementById("input-" + id);
  if (inp) inp.value = next;
  updateCard(id);
  updateProgress();
  saveSession();
  // Haptic
  if (navigator.vibrate) navigator.vibrate(20);
}

function updateCard(id) {
  const card = document.getElementById("card-" + id);
  if (!card) return;
  const val = quantities[id];
  const isCounted = val !== undefined;
  const isZero = isCounted && val === 0;
  card.className = "item-card " + (isZero ? "zero" : isCounted ? "counted" : "");
  const check = card.querySelector(".check-done");
  if (check) {
    check.style.display = isCounted ? "flex" : "none";
    check.textContent = isZero ? "⚠️" : "✓";
  }
}

function updateProgress() {
  const total = ALL_PRODUCTS.length;
  const counted = getCounted();
  const pct = Math.round((counted / total) * 100);

  document.getElementById("progressLabel").textContent = `${counted} / ${total} comptés`;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressBar").style.width = pct + "%";

  const btn = document.getElementById("submitBtn");
  if (counted >= 1) {
    btn.classList.add("ready");
    btn.textContent = `📤 Envoyer (${counted} produits)`;
  } else {
    btn.classList.remove("ready");
    btn.textContent = `📤 Comptez au moins 1 produit`;
  }

  renderZoneTabs();
}

// ══════════════════════════════════════════
// SUBMIT → FIREBASE
// ══════════════════════════════════════════
function submitInventory() {
  const counted = getCounted();
  if (counted < 1) return;
  if (!confirm(`Envoyer l'inventaire de ${counted} produits ?`)) return;

  const now = new Date();
  const dateStr = now.toISOString().split("T")[0]; // YYYY-MM-DD
  const timestamp = now.getTime();

  // Construire les données
  const items = {};
  const pizzappItems = [];
  let alertCount = 0;

  ALL_PRODUCTS.forEach(p => {
    if (quantities[p.id] === undefined) return;
    const qty = quantities[p.id];
    items[p.id] = {
      name: p.name,
      zone: p.zone,
      qty: qty,
      unit: p.unit,
      stockMini: p.stockMini,
      fournisseur: p.fournisseur,
      needOrder: qty < p.stockMini,
      orderQty: qty < p.stockMini ? p.stockMini - qty : 0
    };
    if (qty < p.stockMini) alertCount++;

    // Mapper vers pizzapp si lien existe
    if (p.pizzappId) {
      // Convertir la quantité conditionnement en grammes si condQty est renseigné
      const realQtyGrams = p.condQty > 0 ? qty * p.condQty : qty;
      pizzappItems.push({
        ingredientId: p.pizzappId,
        productId: p.id,
        name: p.name,
        realQty: realQtyGrams,
        realQtyCond: qty,
        condUnit: p.unit,
        condQty: p.condQty || 0,
        unit: p.recipeUnit || p.unit,
        date: dateStr
      });
    }
  });

  const inventoryData = {
    person: personName,
    shop: selectedShop,
    date: dateStr,
    submittedAt: timestamp,
    totalProducts: counted,
    alertCount: alertCount,
    items: items
  };

  // Écrire dans Firebase RTDB
  const invRef = rtdb.ref("inventaires/" + dateStr + "/" + selectedShop + "_" + timestamp);
  invRef.set(inventoryData).then(() => {
    console.log("✅ Inventaire envoyé vers Firebase RTDB");

    // Écrire aussi les données compatibles PizzApp
    // Format attendu par PizzApp : inventaires_pizzapp/{date}/{ingredientId} → realQty
    if (pizzappItems.length > 0) {
      const pizzappRef = rtdb.ref("inventaires_pizzapp/" + dateStr);
      const pizzappData = {};
      pizzappItems.forEach(item => {
        pizzappData[item.ingredientId] = {
          realQty: item.realQty,
          realQtyCond: item.realQtyCond,
          condUnit: item.condUnit,
          condQty: item.condQty,
          unit: item.unit,
          name: item.name,
          productId: item.productId,
          shop: selectedShop,
          person: personName
        };
      });
      pizzappRef.update(pizzappData).then(() => {
        console.log("✅ Données PizzApp sync OK");
      }).catch(e => console.warn("PizzApp sync error:", e));
    }

    showSuccess(counted, alertCount);
  }).catch(err => {
    console.error("❌ Erreur Firebase:", err);
    // Fallback: sauvegarder en local
    const local = JSON.parse(localStorage.getItem("mwaka-inventaires") || "[]");
    local.push(inventoryData);
    localStorage.setItem("mwaka-inventaires", JSON.stringify(local));
    showSuccess(counted, alertCount, true);
  });
}

// ══════════════════════════════════════════
// SUCCESS + CONFETTI
// ══════════════════════════════════════════
function showSuccess(counted, alerts, isLocal) {
  clearSession(); // Nettoyer la session après envoi réussi
  const overlay = document.getElementById("successOverlay");
  document.getElementById("successTitle").textContent = `Merci ${personName} ! 🎉`;
  document.getElementById("successSub").textContent = isLocal
    ? "Inventaire sauvegardé en local (pas de connexion internet). Il sera synchronisé plus tard."
    : "L'inventaire a été envoyé avec succès !";

  document.getElementById("successStats").innerHTML = `
    <div class="success-stat"><div class="val">${counted}</div><div class="lbl">Produits comptés</div></div>
    <div class="success-stat"><div class="val" style="color:${alerts>0?'var(--red)':'var(--green)'}">${alerts}</div><div class="lbl">À commander</div></div>
  `;

  overlay.classList.add("show");
  document.getElementById("mainApp").style.display = "none";
  document.getElementById("submitBar").style.display = "none";

  // CONFETTI !
  launchConfetti();
}

function launchConfetti() {
  const container = document.getElementById("confettiContainer");
  const colors = ["#e76f51","#f97316","#fbbf24","#34d399","#38bdf8","#a78bfa","#f472b6","#fff"];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = Math.random() * 100 + "%";
    el.style.animationDelay = Math.random() * 2 + "s";
    el.style.animationDuration = (2 + Math.random() * 2) + "s";
    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + "px";
    el.style.height = (6 + Math.random() * 8) + "px";
    el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    container.appendChild(el);
  }
}
